SymfonySecurityAnnotationsProvider.name=Symfony 2/3 \u5b89\u5168
PreAuthorizeTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@PreAuthorize</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u6ce8\u89e3\u8ba9\u4f60\u53ef\u4ee5\u5b9a\u4e49\u5728\u8c03\u7528\u65b9\u6cd5\u4e4b\u524d\u6267\u884c\u7684\u8868\u8fbe\u5f0f\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse JMS\SecurityExtraBundle\Annotation\PreAuthorize;\n\nclass MyService {\n\    /**\n\     * @PreAuthorize("hasRole('A') or (hasRole('B') and hasRole('C'))")\n\     */\n\    public function secureMethod() {\n\        // ...\n\    }\n}\n</code></pre>
SecureTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Secure</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u6ce8\u89e3\u8ba9\u4f60\u53ef\u4ee5\u5b9a\u4e49\u8c01\u88ab\u5141\u8bb8\u8c03\u7528\u65b9\u6cd5\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse JMS\SecurityExtraBundle\Annotation\Secure;\n\nclass MyService {\n\    /**\n\     * @Secure(roles="ROLE_USER, ROLE_FOO, ROLE_ADMIN")\n\     */\n\    public function secureMethod() {\n\        // ...\n\    }\n}\n</code></pre>
SecureParamTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@SecureParam</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u6ce8\u89e3\u8ba9\u4f60\u53ef\u4ee5\u4e3a\u4f20\u9012\u7ed9\u65b9\u6cd5\u7684\u53c2\u6570\u5b9a\u4e49\u9650\u5236\u3002\u4ec5\u5f53\u53c2\u6570\u662f\u9886\u57df\u5bf9\u8c61\u65f6\u624d\u6709\u7528\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse JMS\SecurityExtraBundle\Annotation\SecureParam;\n\nclass MyService {\n\    /**\n\     * @SecureParam(name="comment", permissions="EDIT, DELETE")\n\     * @SecureParam(name="post", permissions="OWNER")\n\     */\n\    public function secureMethod($comment, $post) {\n\        // ...\n\    }\n}\n</code></pre>
SecureReturnTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@SecureReturn</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u6ce8\u89e3\u8ba9\u4f60\u53ef\u4ee5\u4e3a\u65b9\u6cd5\u8fd4\u56de\u7684\u503c\u5b9a\u4e49\u9650\u5236\u3002\u540c\u6837\u4ec5\u5f53\u8fd4\u56de\u503c\u662f\u9886\u57df\u5bf9\u8c61\u65f6\u624d\u6709\u7528\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse JMS\SecurityExtraBundle\Annotation\SecureReturn;\n\nclass MyService {\n\    /**\n\     * @SecureReturn(permissions="VIEW")\n\     */\n\    public function secureMethod() {\n\        // ...\n\n\        return $domainObject;\n\    }\n}\n</code></pre>
RunAsTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@RunAs</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u6ce8\u89e3\u8ba9\u4f60\u53ef\u4ee5\u6307\u5b9a\u4ec5\u5728\u65b9\u6cd5\u8c03\u7528\u671f\u95f4\u6dfb\u52a0\u7684\u89d2\u8272\u3002\u8fd9\u4e9b\u89d2\u8272\u4e0d\u4f1a\u5728\u8c03\u7528\u524d\u6216\u8c03\u7528\u540e\u7684\u8bbf\u95ee\u51b3\u7b56\u4e2d\u88ab\u8003\u8651\u3002</p><p>\u8fd9\u901a\u5e38\u7528\u4e8e\u5b9e\u73b0\u53cc\u5c42\u670d\u52a1\u5c42: \u4f60\u62e5\u6709\u516c\u5171\u670d\u52a1\u548c\u79c1\u6709\u670d\u52a1, \u79c1\u6709\u670d\u52a1\u53ea\u80fd\u901a\u8fc7\u7279\u5b9a\u7684\u516c\u5171\u670d\u52a1\u8c03\u7528\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse JMS\SecurityExtraBundle\Annotation\Secure;\nuse JMS\SecurityExtraBundle\Annotation\RunAs;\n\nclass MyPrivateService {\n\    /**\n\     * @Secure(roles="ROLE_PRIVATE_SERVICE")\n\     */\n\    public function aMethodOnlyToBeInvokedThroughASpecificChannel() {\n\        // ...\n\    }\n}\n\nclass MyPublicService {\n\    protected $myPrivateService;\n\n\    /**\n\     * @Secure(roles="ROLE_USER")\n\     * @RunAs(roles="ROLE_PRIVATE_SERVICE")\n\     */\n\    public function canBeInvokedFromOtherServices() {\n\        return $this->myPrivateService->aMethodOnlyToBeInvokedThroughASpecificChannel();\n\    }\n}\n</code></pre>
SatisfiesParentSecurityPolicyTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@SatisfiesParentSecurityPolicy</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u5fc5\u987b\u5728\u8986\u76d6\u4e86\u5177\u6709\u5b89\u5168\u5143\u6570\u636e\u7684\u65b9\u6cd5\u7684\u65b9\u6cd5\u4e0a\u5b9a\u4e49\u6b64\u6ce8\u89e3\u3002\u8fd9\u662f\u4e3a\u4e86\u786e\u4fdd\u4f60\u4e86\u89e3\u88ab\u8986\u76d6\u65b9\u6cd5\u7684\u5b89\u5168\u6027\u65e0\u6cd5\u518d\u88ab\u5f3a\u5236\u6267\u884c, \u5e76\u4e14\u5982\u679c\u8981\u4fdd\u7559\u8fd9\u4e9b\u6ce8\u89e3, \u5fc5\u987b\u5c06\u5b83\u4eec\u5168\u90e8\u590d\u5236\u8fc7\u6765\u3002</p>
