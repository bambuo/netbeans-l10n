NotBlankTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@NotBlank</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u4e0d\u4e3a\u7a7a\u767d, \u5373\u4e0d\u7b49\u4e8e\u7a7a\u5b57\u7b26\u4e32\u4e5f\u4e0d\u7b49\u4e8e <code>null</code>\u3002\u82e5\u53ea\u9700\u5f3a\u5236\u503c\u4e0d\u7b49\u4e8e <code>null</code>, \u53c2\u89c1 <code>NotNull</code> \u7ea6\u675f\u3002</p>\n<table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>NotBlank</code></td></tr><tr>    <td>Validator</td>    <td><code>NotBlankValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5982\u679c\u8981\u786e\u4fdd <code>Author</code> \u7c7b\u7684 <code>firstName</code> \u5c5e\u6027\u4e0d\u4e3a\u7a7a\u767d, \u53ef\u4ee5\u8fd9\u6837\u5199:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\NotBlank()\n\     */\n\    protected $firstName;\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should not be blank</code></p><p>\u8fd9\u662f\u5f53\u503c\u4e3a\u7a7a\u767d\u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p>
BlankTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Blank</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u4e3a\u7a7a\u767d, \u5373\u7b49\u4e8e\u7a7a\u5b57\u7b26\u4e32\u6216\u7b49\u4e8e <code>null</code>\u3002\u82e5\u8981\u5f3a\u5236\u503c\u4e25\u683c\u7b49\u4e8e <code>null</code>, \u53c2\u89c1 <code>Null</code> \u7ea6\u675f\u3002\u82e5\u8981\u5f3a\u5236\u503c\u4e0d\u4e3a\u7a7a\u767d, \u53c2\u89c1 <code>NotBlank</code>\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>Blank</code></td></tr><tr>    <td>Validator</td>    <td><code>BlankValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5982\u679c\u51fa\u4e8e\u67d0\u79cd\u539f\u56e0, \u4f60\u60f3\u786e\u4fdd <code>Author</code> \u7c7b\u7684 <code>firstName</code> \u5c5e\u6027\u4e3a\u7a7a\u767d, \u53ef\u4ee5\u8fd9\u6837\u5199:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Blank()\n\     */\n\    protected $firstName;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be blank</code></p><p>\u8fd9\u662f\u5f53\u503c\u4e0d\u4e3a\u7a7a\u767d\u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p>
NotNullTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@NotNull</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u4e0d\u4e25\u683c\u7b49\u4e8e <code>null</code>\u3002\u82e5\u53ea\u9700\u786e\u4fdd\u503c\u4e0d\u4e3a\u7a7a\u767d (\u4e0d\u662f\u7a7a\u767d\u5b57\u7b26\u4e32), \u53c2\u89c1 <code>NotBlank</code> \u7ea6\u675f\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>NotNull</code></td></tr><tr>    <td>Validator</td>    <td><code>NotNullValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5982\u679c\u8981\u786e\u4fdd <code>Author</code> \u7c7b\u7684 <code>firstName</code> \u5c5e\u6027\u4e0d\u4e25\u683c\u7b49\u4e8e <code>null</code>, \u53ef\u4ee5\u8fd9\u6837\u5199:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\NotNull()\n\     */\n\    protected $firstName;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should not be null</code></p><p>\u8fd9\u662f\u5f53\u503c\u4e3a <code>null</code> \u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p>
NullTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Null</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u6070\u597d\u7b49\u4e8e <code>null</code>\u3002\u82e5\u53ea\u9700\u5f3a\u5236\u5c5e\u6027\u4e3a\u7a7a\u767d (\u7a7a\u767d\u5b57\u7b26\u4e32\u6216 <code>null</code>), \u53c2\u89c1 <code>Blank</code> \u7ea6\u675f\u3002\u82e5\u8981\u786e\u4fdd\u5c5e\u6027\u4e0d\u4e3a <code>null</code>, \u53c2\u89c1 <code>NotNull</code>\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>Null</code></td></tr><tr>    <td>Validator</td>    <td><code>NullValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5982\u679c\u51fa\u4e8e\u67d0\u79cd\u539f\u56e0, \u4f60\u60f3\u786e\u4fdd <code>Author</code> \u7c7b\u7684 <code>firstName</code> \u5c5e\u6027\u6070\u597d\u7b49\u4e8e <code>null</code>, \u53ef\u4ee5\u8fd9\u6837\u5199:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Null()\n\     */\n\    protected $firstName;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</strong> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be null</code></p><p>\u8fd9\u662f\u5f53\u503c\u4e0d\u4e3a <code>null</code> \u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p>
TrueTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@True</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u4e3a <code>true</code>\u3002\u5177\u4f53\u6765\u8bf4, \u5b83\u68c0\u67e5\u503c\u662f\u5426\u6070\u597d\u4e3a <code>true</code>\u3001\u6070\u597d\u4e3a\u6574\u6570 1, \u6216\u6070\u597d\u4e3a\u5b57\u7b26\u4e32 "1"\u3002\u53e6\u89c1 <code>False</code>\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>True</code></td></tr><tr>    <td>Validator</td>    <td><code>TrueValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6b64\u7ea6\u675f\u53ef\u7528\u4e8e\u5c5e\u6027 (\u4f8b\u5982\u6ce8\u518c\u6a21\u578b\u4e0a\u7684 <code>termsAccepted</code> \u5c5e\u6027) \u6216 "getter" \u65b9\u6cd5\u3002\u5b83\u5728\u540e\u8005\u4e2d\u6700\u4e3a\u5f3a\u5927, \u6b64\u65f6\u4f60\u53ef\u4ee5\u65ad\u8a00\u67d0\u4e2a\u65b9\u6cd5\u8fd4\u56de true \u503c\u3002\u4f8b\u5982, \u5047\u8bbe\u6709\u4ee5\u4e0b\u65b9\u6cd5:</p><pre><code>\nclass Author {\n\    protected $token;\n\n\    public function isTokenValid() {\n\        return $this->token == $this->generateToken();\n\    }\n}\n</code></pre><p>\u7136\u540e\u53ef\u4ee5\u4f7f\u7528 <code>True</code> \u6765\u7ea6\u675f\u6b64\u65b9\u6cd5\u3002</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    protected $token;\n\n\    /**\n\     * @Assert\\True(message = "The token is invalid")\n\     */\n\    public function isTokenValid() {\n\        return $this->token == $this->generateToken();\n\    }\n}\n</code></pre><p>\u5982\u679c <code>isTokenValid()</code> \u8fd4\u56de false, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be true</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u4e3a true, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
FalseTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@False</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u4e3a <code>false</code>\u3002\u5177\u4f53\u6765\u8bf4, \u5b83\u68c0\u67e5\u503c\u662f\u5426\u6070\u597d\u4e3a <code>false</code>\u3001\u6070\u597d\u4e3a\u6574\u6570 0, \u6216\u6070\u597d\u4e3a\u5b57\u7b26\u4e32 "0"\u3002\u53e6\u89c1 <code>True</code>\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>False</code></td></tr><tr>    <td>Validator</td>    <td><code>FalseValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p><code>False</code> \u7ea6\u675f\u53ef\u7528\u4e8e\u5c5e\u6027\u6216 "getter" \u65b9\u6cd5, \u4f46\u6700\u5e38\u7528\u4e8e\u540e\u8005\u3002\u4f8b\u5982, \u5047\u8bbe\u4f60\u8981\u4fdd\u8bc1\u67d0\u4e2a\u72b6\u6001\u5c5e\u6027 <i>\u4e0d</i> \u5728\u52a8\u6001 <code>invalidStates</code> \u6570\u7ec4\u4e2d\u3002\u9996\u5148, \u521b\u5efa\u4e00\u4e2a "getter" \u65b9\u6cd5:</p><pre><code>\nprotected $state;\n\nprotected $invalidStates = array();\n\npublic function isStateInvalid() {\n    return in_array($this->state, $this->invalidStates);\n}\n</code></pre><p>\u5728\u6b64\u60c5\u51b5\u4e0b, \u53ea\u6709\u5f53 <code>isStateInvalid</code> \u65b9\u6cd5\u8fd4\u56de <b>false</b> \u65f6, \u5e95\u5c42\u5bf9\u8c61\u624d\u6709\u6548:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\False()\n\     */\n\     public function isStateInvalid($message = "You've entered an invalid state.") {\n\        // ...\n\     }\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be false</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u4e3a false, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
TypeTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Type</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u5c5e\u4e8e\u7279\u5b9a\u7684\u6570\u636e\u7c7b\u578b\u3002\u4f8b\u5982, \u5982\u679c\u67d0\u4e2a\u53d8\u91cf\u5e94\u4e3a\u6570\u7ec4, \u53ef\u4ee5\u4f7f\u7528\u6b64\u7ea6\u675f\u5e76\u6307\u5b9a array \u7c7b\u578b\u9009\u9879\u6765\u8fdb\u884c\u9a8c\u8bc1\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;"><li>type</li><li>message</li></ul></td></tr><tr>    <td>Class</td>    <td><code>Type</code></td></tr><tr>    <td>Validator</td>    <td><code>TypeValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Type(type="integer", message="The value {{ value }} is not a valid {{ type }}.")\n\     */\n\    protected $age;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">type</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f\u5b8c\u5168\u9650\u5b9a\u7c7b\u540d, \u6216\u7531 PHP <code>is_</code> \u51fd\u6570\u786e\u5b9a\u7684 PHP \u6570\u636e\u7c7b\u578b\u4e4b\u4e00\u3002</p><ul>    <li>array</li>    <li>bool</li>    <li>callable</li>    <li>float</li>    <li>double</li>    <li>int</li>    <li>integer</li>    <li>long</li>    <li>null</li>    <li>numeric</li>    <li>object</li>    <li>real</li>    <li>resource</li>    <li>scalar</li>    <li>string</li></ul><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be of type {{ type }}</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u5c5e\u4e8e\u7ed9\u5b9a\u7c7b\u578b, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
EmailTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Email</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684\u7535\u5b50\u90ae\u4ef6\u5730\u5740\u3002\u5e95\u5c42\u7684\u503c\u5728\u9a8c\u8bc1\u4e4b\u524d\u4f1a\u88ab\u8f6c\u6362\u4e3a\u5b57\u7b26\u4e32\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>            <li>checkMX</li>            <li>checkHost</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Email</code></td></tr><tr>    <td>Validator</td>    <td><code>EmailValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Email(\n\     *     message = "The email '{{ value }}' is not a valid email.",\n\     *     checkMX = true\n\     * )\n\     */\n\     protected $email;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid email address</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u662f\u6709\u6548\u7684\u7535\u5b50\u90ae\u4ef6\u5730\u5740, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">checkMX</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>false</code></p><p>\u5982\u679c\u4e3a true, \u5219\u5c06\u4f7f\u7528 PHP \u51fd\u6570 <code>checkdnsrr</code> \u68c0\u67e5\u7ed9\u5b9a\u7535\u5b50\u90ae\u4ef6\u4e3b\u673a\u7684 MX \u8bb0\u5f55\u662f\u5426\u6709\u6548\u3002</p><p style="font-weight: bold; font-style: italic">checkHost</p><p style="font-style: italic">New in version 2.1: The <code>checkHost</code> option was added in Symfony 2.1</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>false</code></p><p>\u5982\u679c\u4e3a true, \u5219\u5c06\u4f7f\u7528 PHP \u51fd\u6570 <code>checkdnsrr</code> \u68c0\u67e5\u7ed9\u5b9a\u7535\u5b50\u90ae\u4ef6\u4e3b\u673a\u7684 MX\u3001A \u6216 AAAA \u8bb0\u5f55\u662f\u5426\u6709\u6548\u3002</p>
MinLengthTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@MinLength</p><p style="font-style: italic">The <code>MinLength</code> constraint is deprecated since version 2.1 and will be removed in Symfony 2.3. Use <code>Length</code> with the <code>min</code> option instead.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u5b57\u7b26\u4e32\u7684\u957f\u5ea6\u81f3\u5c11\u8fbe\u5230\u7ed9\u5b9a\u7684\u9650\u5236\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>limit</li>            <li>message</li>            <li>charset</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>MinLength</code></td></tr><tr>    <td>Validator</td>    <td><code>MinLengthValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Blog {\n\    /**\n\     * @Assert\\MinLength(\n\     *     limit=3,\n\     *     message="Your name must have at least {{ limit }} characters."\n\     * )\n\     */\n\    protected $summary;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">limit</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "min" \u503c\u3002\u5982\u679c\u7ed9\u5b9a\u5b57\u7b26\u4e32\u7684\u957f\u5ea6<b>\u5c0f\u4e8e</b>\u6b64\u6570\u5b57, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is too short. It should have {{ limit }} characters or more</code></p><p>\u5982\u679c\u5e95\u5c42\u5b57\u7b26\u4e32\u7684\u957f\u5ea6\u77ed\u4e8e limit \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">charset</p><p><strong>\u7c7b\u578b</strong>: <code>charset</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>UTF-8</code></p><p>\u5982\u679c\u5b89\u88c5\u4e86 PHP \u6269\u5c55 "mbstring", \u5219\u5c06\u4f7f\u7528 PHP \u51fd\u6570 <code>mb_strlen</code> \u8ba1\u7b97\u5b57\u7b26\u4e32\u7684\u957f\u5ea6\u3002<code>charset</code> \u9009\u9879\u7684\u503c\u5c06\u4f5c\u4e3a\u7b2c\u4e8c\u4e2a\u53c2\u6570\u4f20\u7ed9\u8be5\u51fd\u6570\u3002</p>
MaxLengthTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@MaxLength</p><p style="font-style: italic">The <code>MaxLength</code> constraint is deprecated since version 2.1 and will be removed in Symfony 2.3. Use <code>Length</code> with the <code>min</code> option instead.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u5b57\u7b26\u4e32\u7684\u957f\u5ea6\u4e0d\u8d85\u8fc7\u7ed9\u5b9a\u7684\u9650\u5236\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>limit</li>            <li>message</li>            <li>charset</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>MaxLength</code></td></tr><tr>    <td>Validator</td>    <td><code>MaxLengthValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Blog {\n\    /**\n\     * @Assert\\MaxLength(100)\n\     */\n\    protected $summary;\n}</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">limit</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "max" \u503c\u3002\u5982\u679c\u7ed9\u5b9a\u5b57\u7b26\u4e32\u7684\u957f\u5ea6<b>\u5927\u4e8e</b>\u6b64\u6570\u5b57, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is too long. It should have {{ limit }} characters or less</code></p><p>\u5982\u679c\u5e95\u5c42\u5b57\u7b26\u4e32\u7684\u957f\u5ea6\u8d85\u8fc7 limit \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">charset</p><p><strong>\u7c7b\u578b</strong>: <code>charset</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>UTF-8</code></p><p>\u5982\u679c\u5b89\u88c5\u4e86 PHP \u6269\u5c55 "mbstring", \u5219\u5c06\u4f7f\u7528 PHP \u51fd\u6570 <code>mb_strlen</code> \u8ba1\u7b97\u5b57\u7b26\u4e32\u7684\u957f\u5ea6\u3002<code>charset</code> \u9009\u9879\u7684\u503c\u5c06\u4f5c\u4e3a\u7b2c\u4e8c\u4e2a\u53c2\u6570\u4f20\u7ed9\u8be5\u51fd\u6570\u3002</p>
LengthTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Length</p><p style="font-style: italic">New in version 2.1: The <code>Length</code> constraint was added in Symfony 2.1.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32\u957f\u5ea6\u4ecb\u4e8e\u67d0\u4e2a\u6700\u5c0f\u503c\u548c\u6700\u5927\u503c\u4e4b\u95f4\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>min</li>            <li>max</li>            <li>charset</li>            <li>minMessage</li>            <li>maxMessage</li>            <li>exactMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Length</code></td></tr><tr>    <td>Validator</td>    <td><code>LengthValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u8981\u9a8c\u8bc1\u67d0\u4e2a\u7c7b\u7684 <code>firstName</code> \u5b57\u6bb5\u957f\u5ea6\u4ecb\u4e8e "2" \u548c "50" \u4e4b\u95f4, \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Participant {\n\    /**\n\     * @Assert\\Length(\n\     *      min = "2",\n\     *      max = "50",\n\     *      minMessage = "Your first name must be at least {{ limit }} characters length",\n\     *      maxMessage = "Your first name cannot be longer than than {{ limit }} characters length"\n\     * )\n\     */\n\     protected $firstName;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">min</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "min" \u957f\u5ea6\u503c\u3002\u5982\u679c\u7ed9\u5b9a\u503c\u7684\u957f\u5ea6<b>\u5c0f\u4e8e</b>\u6b64\u6700\u5c0f\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">max</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "max" \u957f\u5ea6\u503c\u3002\u5982\u679c\u7ed9\u5b9a\u503c\u7684\u957f\u5ea6<b>\u5927\u4e8e</b>\u6b64\u6700\u5927\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p><strong>\u7c7b\u578b</strong>: <code>charset</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>UTF-8</code></p><p>\u8ba1\u7b97\u503c\u957f\u5ea6\u65f6\u4f7f\u7528\u7684\u5b57\u7b26\u96c6\u3002\u5982\u679c\u53ef\u7528, \u5c06\u4f7f\u7528 PHP \u51fd\u6570 <code>grapheme_strlen</code>; \u5982\u679c\u4e0d\u53ef\u7528, \u5219\u5728\u53ef\u7528\u65f6\u4f7f\u7528 <code>mb_strlen</code> PHP \u51fd\u6570; \u5982\u679c\u90fd\u4e0d\u53ef\u7528, \u5219\u4f7f\u7528 <code>strlen</code> PHP \u51fd\u6570\u3002</p><p style="font-weight: bold; font-style: italic">minMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is too short. It should have {{ limit }} characters or more.</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u7684\u957f\u5ea6\u5c0f\u4e8e <code>min</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">maxMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is too long. It should have {{ limit }} characters or less.</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u7684\u957f\u5ea6\u5927\u4e8e <code>max</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">exactMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should have exactly {{ limit }} characters.</code></p><p>\u5982\u679c <code>min</code> \u548c <code>max</code> \u503c\u76f8\u7b49\u4e14\u5e95\u5c42\u503c\u7684\u957f\u5ea6\u4e0d\u6070\u597d\u7b49\u4e8e\u8be5\u503c, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
UrlTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Url</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684 URL \u5b57\u7b26\u4e32\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>            <li>protocols</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Url</code></td></tr><tr>    <td>Validator</td>    <td><code>UrlValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p></p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Url()\n\     */\n\     protected $bioUrl;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid URL</code></p><p>\u5982\u679c URL \u65e0\u6548, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">protocols</p><p><strong>\u7c7b\u578b</strong>: <code>array</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>array('http', 'https')</code></p><p>\u5c06\u88ab\u89c6\u4e3a\u6709\u6548\u7684\u534f\u8bae\u3002\u4f8b\u5982, \u5982\u679c\u8fd8\u9700\u8981 <code>ftp://</code> \u7c7b\u578b\u7684 URL \u6709\u6548, \u53ef\u4ee5\u91cd\u65b0\u5b9a\u4e49 <code>protocols</code> \u6570\u7ec4, \u5217\u51fa <code>http</code>\u3001<code>https</code> \u4ee5\u53ca <code>ftp</code>\u3002</p>
RegexTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Regex</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u5339\u914d\u67d0\u4e2a\u6b63\u5219\u8868\u8fbe\u5f0f\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>pattern</li>            <li>match</li>            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Regex</code></td></tr><tr>    <td>Validator</td>    <td><code>RegexValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5047\u8bbe\u6709\u4e00\u4e2a <code>description</code> \u5b57\u6bb5, \u4f60\u60f3\u9a8c\u8bc1\u5b83\u4ee5\u6709\u6548\u7684\u5355\u8bcd\u5b57\u7b26\u5f00\u5934\u3002\u7528\u4e8e\u6d4b\u8bd5\u7684\u6b63\u5219\u8868\u8fbe\u5f0f\u4e3a <code>/^\w+/</code>, \u8868\u793a\u4f60\u5728\u67e5\u627e\u5b57\u7b26\u4e32\u5f00\u5934\u81f3\u5c11\u4e00\u4e2a\u6216\u591a\u4e2a\u5355\u8bcd\u5b57\u7b26:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Regex("/^\w+/")\n\     */\n\    protected $description;\n}\n</code></pre><p>\u6216\u8005, \u53ef\u4ee5\u5c06 <code>match</code> \u9009\u9879\u8bbe\u4e3a <code>false</code>, \u4ee5\u65ad\u8a00\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32<b>\u4e0d</b>\u5339\u914d\u3002\u5728\u4e0b\u9762\u7684\u793a\u4f8b\u4e2d, \u4f60\u5c06\u65ad\u8a00 <code>firstName</code> \u5b57\u6bb5\u4e0d\u5305\u542b\u4efb\u4f55\u6570\u5b57, \u5e76\u4e3a\u5176\u63d0\u4f9b\u81ea\u5b9a\u4e49\u6d88\u606f:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Regex(\n\     *     pattern="/\d/",\n\     *     match=false,\n\     *     message="Your name cannot contain a number"\n\     * )\n\     */\n\    protected $firstName;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">pattern</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f\u7528\u4e8e\u5339\u914d\u8f93\u5165\u7684\u6b63\u5219\u8868\u8fbe\u5f0f\u6a21\u5f0f\u3002\u9ed8\u8ba4\u60c5\u51b5\u4e0b, \u5982\u679c\u8f93\u5165\u5b57\u7b26\u4e32<b>\u4e0d</b>\u5339\u914d\u6b64\u6b63\u5219\u8868\u8fbe\u5f0f (\u901a\u8fc7 PHP \u7684 <code>preg_match</code> \u51fd\u6570), \u6b64\u9a8c\u8bc1\u5668\u5c06\u5931\u8d25\u3002\u4f46\u5982\u679c <code>match</code> \u8bbe\u4e3a <code>false</code>, \u5219\u5f53\u8f93\u5165\u5b57\u7b26\u4e32<b>\u786e\u5b9e</b>\u5339\u914d\u6b64\u6a21\u5f0f\u65f6\u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">match</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>true</code></p><p>\u5982\u679c\u4e3a <code>true</code> (\u6216\u672a\u8bbe\u7f6e), \u5f53\u7ed9\u5b9a\u5b57\u7b26\u4e32\u5339\u914d\u7ed9\u5b9a\u7684\u6a21\u5f0f\u6b63\u5219\u8868\u8fbe\u5f0f\u65f6, \u6b64\u9a8c\u8bc1\u5668\u5c06\u901a\u8fc7\u3002\u800c\u5f53\u6b64\u9009\u9879\u8bbe\u4e3a <code>false</code> \u65f6\u5219\u76f8\u53cd: \u4ec5\u5f53\u7ed9\u5b9a\u5b57\u7b26\u4e32<b>\u4e0d</b>\u5339\u914d\u6a21\u5f0f\u6b63\u5219\u8868\u8fbe\u5f0f\u65f6\u9a8c\u8bc1\u624d\u4f1a\u901a\u8fc7\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not valid</code></p><p>\u8fd9\u662f\u5f53\u6b64\u9a8c\u8bc1\u5668\u5931\u8d25\u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p>
IpTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Ip</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684 IP \u5730\u5740\u3002\u9ed8\u8ba4\u6309 IPv4 \u9a8c\u8bc1, \u4f46\u4e5f\u63d0\u4f9b\u591a\u79cd\u9009\u9879\u4ee5\u6309 IPv6 \u53ca\u8bb8\u591a\u5176\u4ed6\u7ec4\u5408\u8fdb\u884c\u9a8c\u8bc1\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>version</li>            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Ip</code></td></tr><tr>    <td>Validator</td>    <td><code>IpValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Ip\n\     */\n\     protected $ipAddress;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">version</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>4</code></p><p>\u5b83\u786e\u5b9a IP \u5730\u5740\u7684\u786e\u5207\u9a8c\u8bc1\u65b9\u5f0f, \u53ef\u53d6\u591a\u79cd\u4e0d\u540c\u7684\u503c:</p><p><strong>\u6240\u6709\u8303\u56f4</strong></p><ul><li><code>4</code> - Validates for IPv4 addresses</li><li><code>6</code> - Validates for IPv6 addresses</li><li><code>all</code> - Validates all IP formats</li></ul><p><strong>\u65e0\u79c1\u6709\u8303\u56f4</strong></p><ul><li><code>4_no_priv</code> - Validates for IPv4 but without private IP ranges</li><li><code>6_no_priv</code> - Validates for IPv6 but without private IP ranges</li><li><code>all_no_priv</code> - Validates for all IP formats but without private IP ranges</li></ul><p><strong>\u65e0\u4fdd\u7559\u8303\u56f4</strong></p><ul><li><code>4_no_res</code> - Validates for IPv4 but without reserved IP ranges</li><li><code>6_no_res</code> - Validates for IPv6 but without reserved IP ranges</li><li><code>all_no_res</code> - Validates for all IP formats but without reserved IP ranges</li></ul><p><strong>\u4ec5\u516c\u5171\u8303\u56f4</strong></p><ul><li><code>4_public</code> - Validates for IPv4 but without private and reserved ranges</li><li><code>6_public</code> - Validates for IPv6 but without private and reserved ranges</li><li><code>all_public</code> - Validates for all IP formats but without private and reserved ranges</li></ul><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This is not a valid IP address</code></p><p>\u5982\u679c\u5b57\u7b26\u4e32\u4e0d\u662f\u6709\u6548\u7684 IP \u5730\u5740, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
MaxTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Max</p><p style="font-style: italic">The <code>Max</code> constraint is deprecated since version 2.1 and will be removed in Symfony 2.3. Use <code>Range</code> with the <code>max</code> option instead.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u7ed9\u5b9a\u7684\u6570<b>\u5c0f\u4e8e</b>\u67d0\u4e2a\u6700\u5927\u6570\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>limit</li>            <li>message</li>            <li>invalidMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Max</code></td></tr><tr>    <td>Validator</td>    <td><code>MaxValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u8981\u9a8c\u8bc1\u67d0\u4e2a\u7c7b\u7684 "age" \u5b57\u6bb5\u4e0d\u5927\u4e8e "50", \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Participant {\n\    /**\n\     * @Assert\\Max(limit = 50, message = "You must be 50 or under to enter.")\n\     */\n\     protected $age;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">limit</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "max" \u503c\u3002\u5982\u679c\u7ed9\u5b9a\u503c<b>\u5927\u4e8e</b>\u6b64\u6700\u5927\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be {{ limit }} or less</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u5927\u4e8e <code>limit</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">invalidMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be a valid number</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u4e0d\u662f\u6570\u5b57 (\u4f9d\u636e <code>is_numeric</code> PHP \u51fd\u6570), \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
MinTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Min</p><p style="font-style: italic">The <code>Min</code> constraint is deprecated since version 2.1 and will be removed in Symfony 2.3. Use <code>Range</code> with the <code>min</code> option instead.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u7ed9\u5b9a\u7684\u6570<b>\u5927\u4e8e</b>\u67d0\u4e2a\u6700\u5c0f\u6570\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>limit</li>            <li>message</li>            <li>invalidMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Min</code></td></tr><tr>    <td>Validator</td>    <td><code>MinValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u8981\u9a8c\u8bc1\u67d0\u4e2a\u7c7b\u7684 "age" \u5b57\u6bb5\u4e3a "18" \u6216\u66f4\u5927, \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Participant {\n\    /**\n\     * @Assert\\Min(limit = "18", message = "You must be 18 or older to enter")\n\     */\n\     protected $age;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">limit</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "min" \u503c\u3002\u5982\u679c\u7ed9\u5b9a\u503c<b>\u5c0f\u4e8e</b>\u6b64\u6700\u5c0f\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be {{ limit }} or more</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u5c0f\u4e8e <code>limit</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">invalidMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be a valid number</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u4e0d\u662f\u6570\u5b57 (\u4f9d\u636e <code>is_numeric</code> PHP \u51fd\u6570), \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
RangeTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Range</p><p style="font-style: italic">New in version 2.1: The <code>Range</code> constraint was added in Symfony 2.1.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u7ed9\u5b9a\u7684\u6570<b>\u4ecb\u4e8e</b>\u67d0\u4e2a\u6700\u5c0f\u6570\u548c\u6700\u5927\u6570\u4e4b\u95f4\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>min</li>            <li>max</li>            <li>minMessage</li>            <li>maxMessage</li>            <li>invalidMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Range</code></td></tr><tr>    <td>Validator</td>    <td><code>RangeValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u8981\u9a8c\u8bc1\u67d0\u4e2a\u7c7b\u7684 "height" \u5b57\u6bb5\u4ecb\u4e8e "120" \u548c "180" \u4e4b\u95f4, \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Participant {\n\    /**\n\     * @Assert\\Range(\n\     *      min = 120,\n\     *      max = 180,\n\     *      minMessage = "You must be at least 120cm tall to enter",\n\     *      maxMessage = "You cannot be taller than 180cm to enter"\n\     * )\n\     */\n\     protected $height;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">min</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "min" \u503c\u3002\u5982\u679c\u7ed9\u5b9a\u503c<b>\u5c0f\u4e8e</b>\u6b64\u6700\u5c0f\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">max</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "max" \u503c\u3002\u5982\u679c\u7ed9\u5b9a\u503c<b>\u5927\u4e8e</b>\u6b64\u6700\u5927\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">minMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be {{ limit }} or more.</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u5c0f\u4e8e <code>min</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">maxMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be {{ limit }} or less.</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u5927\u4e8e <code>max</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">invalidMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be a valid number</code></p><p>\u5982\u679c\u5e95\u5c42\u503c\u4e0d\u662f\u6570\u5b57 (\u4f9d\u636e <code>is_numeric</code> PHP \u51fd\u6570), \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
DateTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Date</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684\u65e5\u671f, \u5373 <code>DateTime</code> \u5bf9\u8c61, \u6216\u9075\u5faa\u6709\u6548 YYYY-MM-DD \u683c\u5f0f\u7684\u5b57\u7b26\u4e32 (\u6216\u53ef\u8f6c\u6362\u4e3a\u5b57\u7b26\u4e32\u7684\u5bf9\u8c61)\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Date</code></td></tr><tr>    <td>Validator</td>    <td><code>DateValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Date()\n\     */\n\     protected $birthday;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid date</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u662f\u6709\u6548\u7684\u65e5\u671f, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
DateTimeTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@DateTime</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684 "datetime", \u5373 <code>DateTime</code> \u5bf9\u8c61, \u6216\u9075\u5faa\u6709\u6548 YYYY-MM-DD HH:MM:SS \u683c\u5f0f\u7684\u5b57\u7b26\u4e32 (\u6216\u53ef\u8f6c\u6362\u4e3a\u5b57\u7b26\u4e32\u7684\u5bf9\u8c61)\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>DateTime</code></td></tr><tr>    <td>Validator</td>    <td><code>DateTimeValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\DateTime()\n\     */\n\     protected $createdAt;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid datetime</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u662f\u6709\u6548\u7684 datetime, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
TimeTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Time</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684\u65f6\u95f4, \u5373 <code>DateTime</code> \u5bf9\u8c61, \u6216\u9075\u5faa\u6709\u6548 "HH:MM:SS" \u683c\u5f0f\u7684\u5b57\u7b26\u4e32 (\u6216\u53ef\u8f6c\u6362\u4e3a\u5b57\u7b26\u4e32\u7684\u5bf9\u8c61)\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Time</code></td></tr><tr>    <td>Validator</td>    <td><code>TimeValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5047\u8bbe\u6709\u4e00\u4e2a Event \u7c7b, \u5176\u4e2d\u7684 <code>startsAt</code> \u5b57\u6bb5\u662f\u6d3b\u52a8\u5f00\u59cb\u7684\u65f6\u95f4:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Event {\n\    /**\n\     * @Assert\\Time()\n\     */\n\     protected $startsAt;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid time</code></p><p>\u5982\u679c\u5e95\u5c42\u6570\u636e\u4e0d\u662f\u6709\u6548\u7684\u65f6\u95f4, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
ChoiceTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Choice</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u7ea6\u675f\u7528\u4e8e\u786e\u4fdd\u7ed9\u5b9a\u503c\u5c5e\u4e8e\u7ed9\u5b9a\u7684<i>\u6709\u6548</i>\u9009\u9879\u96c6\u3002\u5b83\u8fd8\u53ef\u7528\u4e8e\u9a8c\u8bc1\u6570\u7ec4\u4e2d\u7684\u6bcf\u4e00\u9879\u662f\u5426\u90fd\u5c5e\u4e8e\u8fd9\u4e9b\u6709\u6548\u9009\u9879\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>choices</li>            <li>callback</li>            <li>multiple</li>            <li>min</li>            <li>max</li>            <li>message</li>            <li>multipleMessage</li>            <li>minMessage</li>            <li>maxMessage</li>            <li>strict</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Choice</code></td></tr><tr>    <td>Validator</td>    <td><code>ChoiceValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6b64\u7ea6\u675f\u7684\u57fa\u672c\u601d\u60f3\u662f\u4e3a\u5176\u63d0\u4f9b\u4e00\u4e2a\u6709\u6548\u503c\u6570\u7ec4 (\u53ef\u4ee5\u901a\u8fc7\u591a\u79cd\u65b9\u5f0f\u63d0\u4f9b), \u5b83\u4f1a\u9a8c\u8bc1\u7ed9\u5b9a\u5c5e\u6027\u7684\u503c\u5b58\u5728\u4e8e\u8be5\u6570\u7ec4\u4e2d\u3002</p><p>\u5982\u679c\u4f60\u7684\u6709\u6548\u9009\u9879\u5217\u8868\u5f88\u7b80\u5355, \u53ef\u4ee5\u901a\u8fc7 <code>choices</code> \u9009\u9879\u76f4\u63a5\u4f20\u5165:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Choice(choices = {"male", "female"}, message = "Choose a valid gender.")\n\     */\n\    protected $gender;\n}\n</code></pre><p>\u4e5f\u53ef\u4ee5\u4f7f\u7528\u56de\u8c03\u51fd\u6570\u6765\u6307\u5b9a\u9009\u9879\u3002\u5982\u679c\u4f60\u60f3\u628a\u9009\u9879\u96c6\u4e2d\u4fdd\u5b58\u5728\u67d0\u5904\u4ee5\u4fbf\u9a8c\u8bc1\u6216\u6784\u5efa\u9009\u62e9\u8868\u5355\u5143\u7d20, \u8fd9\u4f1a\u975e\u5e38\u6709\u7528\u3002\u53ef\u4ee5\u5c06\u6b64\u65b9\u6cd5\u7684\u540d\u79f0\u4f20\u7ed9 <code>Choice</code> \u7ea6\u675f\u7684 <code>callback</code> \u9009\u9879\u3002</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Choice(callback = "getGenders")\n\     */\n\    protected $gender;\n\n\    public static function getGenders() {\n\        return array('male', 'female');\n\    }\n}\n</code></pre><p>\u5982\u679c\u9759\u6001\u56de\u8c03\u5b58\u50a8\u5728\u53e6\u4e00\u4e2a\u7c7b\u4e2d (\u4f8b\u5982 <code>Util</code>), \u53ef\u4ee5\u4ee5\u6570\u7ec4\u5f62\u5f0f\u4f20\u5165\u7c7b\u540d\u548c\u65b9\u6cd5\u3002</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Choice(callback = {"Util", "getGenders"})\n\     */\n\    protected $gender;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">choices</p><p><strong>\u7c7b\u578b</strong>: <code>array</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u4e00\u4e2a\u5fc5\u586b\u9009\u9879 (\u9664\u975e\u6307\u5b9a\u4e86 <code>callback</code>) - \u8fd9\u662f\u5e94\u7eb3\u5165\u6709\u6548\u9009\u9879\u96c6\u7684\u9009\u9879\u6570\u7ec4\u3002\u8f93\u5165\u503c\u5c06\u4e0e\u6b64\u6570\u7ec4\u8fdb\u884c\u5339\u914d\u3002</p><p style="font-weight: bold; font-style: italic">callback</p><p><strong>\u7c7b\u578b</strong>: <code>string|array|Closure</code></p><p>\u8fd9\u662f\u4e00\u4e2a\u56de\u8c03\u65b9\u6cd5, \u53ef\u7528\u6765\u4ee3\u66ff <code>choices</code> \u9009\u9879\u8fd4\u56de\u9009\u9879\u6570\u7ec4\u3002</p><p style="font-weight: bold; font-style: italic">multiple</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>false</code></p><p>\u5982\u679c\u6b64\u9009\u9879\u4e3a true, \u5219\u8f93\u5165\u503c\u5e94\u4e3a\u6570\u7ec4\u800c\u4e0d\u662f\u5355\u4e2a\u6807\u91cf\u503c\u3002\u8be5\u7ea6\u675f\u5c06\u68c0\u67e5\u8f93\u5165\u6570\u7ec4\u4e2d\u7684\u6bcf\u4e2a\u503c\u90fd\u80fd\u5728\u6709\u6548\u9009\u9879\u6570\u7ec4\u4e2d\u627e\u5230\u3002\u53ea\u8981\u6709\u4e00\u4e2a\u8f93\u5165\u503c\u627e\u4e0d\u5230, \u9a8c\u8bc1\u5c31\u4f1a\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">min</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code></p><p>\u5982\u679c <code>multiple</code> \u9009\u9879\u4e3a true, \u5219\u53ef\u4ee5\u4f7f\u7528 <code>min</code> \u9009\u9879\u5f3a\u5236\u81f3\u5c11\u9009\u62e9 XX \u4e2a\u503c\u3002\u4f8b\u5982, \u5982\u679c <code>min</code> \u4e3a 3, \u4f46\u8f93\u5165\u6570\u7ec4\u53ea\u5305\u542b 2 \u4e2a\u6709\u6548\u9879, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">max</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code></p><p>\u5982\u679c <code>multiple</code> \u9009\u9879\u4e3a true, \u5219\u53ef\u4ee5\u4f7f\u7528 <code>max</code> \u9009\u9879\u5f3a\u5236\u6700\u591a\u9009\u62e9 XX \u4e2a\u503c\u3002\u4f8b\u5982, \u5982\u679c <code>max</code> \u4e3a 3, \u4f46\u8f93\u5165\u6570\u7ec4\u5305\u542b 4 \u4e2a\u6709\u6548\u9879, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The value you selected is not a valid choice</code></p><p>\u8fd9\u662f\u5f53 <code>multiple</code> \u9009\u9879\u8bbe\u4e3a <code>false</code> \u4e14\u5e95\u5c42\u503c\u4e0d\u5728\u6709\u6548\u9009\u9879\u6570\u7ec4\u4e2d\u65f6\u6536\u5230\u7684\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">multipleMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>One or more of the given values is invalid</code></p><p>\u8fd9\u662f\u5f53 <code>multiple</code> \u9009\u9879\u8bbe\u4e3a <code>true</code> \u4e14\u88ab\u68c0\u67e5\u6570\u7ec4\u4e2d\u7684\u67d0\u4e2a\u503c\u4e0d\u5728\u6709\u6548\u9009\u9879\u6570\u7ec4\u4e2d\u65f6\u6536\u5230\u7684\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">minMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>You must select at least {{ limit }} choices</code></p><p>\u8fd9\u662f\u5f53\u7528\u6237\u6309\u7167 <code>min</code> \u9009\u9879\u9009\u62e9\u7684\u9009\u9879\u592a\u5c11\u65f6\u663e\u793a\u7684\u9a8c\u8bc1\u9519\u8bef\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">maxMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>You must select at most {{ limit }} choices</code></p><p>\u8fd9\u662f\u5f53\u7528\u6237\u6309\u7167 <code>max</code> \u9009\u9879\u9009\u62e9\u7684\u9009\u9879\u592a\u591a\u65f6\u663e\u793a\u7684\u9a8c\u8bc1\u9519\u8bef\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">strict</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>false</code></p><p>\u5982\u679c\u4e3a <code>true</code>, \u9a8c\u8bc1\u5668\u8fd8\u4f1a\u68c0\u67e5\u8f93\u5165\u503c\u7684\u7c7b\u578b\u3002\u5177\u4f53\u6765\u8bf4, \u5728\u68c0\u67e5\u67d0\u4e2a\u503c\u662f\u5426\u4f4d\u4e8e\u6709\u6548\u9009\u9879\u6570\u7ec4\u4e2d\u65f6, \u6b64\u503c\u4f1a\u4f5c\u4e3a\u7b2c\u4e09\u4e2a\u53c2\u6570\u4f20\u7ed9 PHP \u7684 <code>in_array</code> \u65b9\u6cd5\u3002</p>
CollectionTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Collection</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u5f53\u5e95\u5c42\u6570\u636e\u662f\u4e00\u4e2a\u96c6\u5408 (\u5373\u5b9e\u73b0 <code>Traversable</code> \u548c <code>ArrayAccess</code> \u7684\u6570\u7ec4\u6216\u5bf9\u8c61), \u800c\u4f60\u53c8\u5e0c\u671b\u4ee5\u4e0d\u540c\u65b9\u5f0f\u9a8c\u8bc1\u8be5\u96c6\u5408\u7684\u4e0d\u540c\u952e\u65f6, \u53ef\u4ee5\u4f7f\u7528\u6b64\u7ea6\u675f\u3002\u4f8b\u5982, \u53ef\u4ee5\u7528 <code>Email</code> \u7ea6\u675f\u9a8c\u8bc1 <code>email</code> \u952e, \u7528 <code>Range</code> \u7ea6\u675f\u9a8c\u8bc1\u96c6\u5408\u7684 <code>inventory</code> \u952e\u3002</p><p>\u6b64\u7ea6\u675f\u8fd8\u53ef\u4ee5\u786e\u4fdd\u67d0\u4e9b\u96c6\u5408\u952e\u5b58\u5728\u4e14\u6ca1\u6709\u591a\u4f59\u7684\u952e\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>fields</li>            <li>allowExtraFields</li>            <li>extraFieldsMessage</li>            <li>allowMissingFields</li>            <li>missingFieldsMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Collection</code></td></tr><tr>    <td>Validator</td>    <td><code>CollectionValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p><code>Collection</code> \u7ea6\u675f\u5141\u8bb8\u4f60\u9010\u4e2a\u9a8c\u8bc1\u96c6\u5408\u7684\u4e0d\u540c\u952e\u3002\u8981\u9a8c\u8bc1 <code>profileData</code> \u6570\u7ec4\u5c5e\u6027\u7684 <code>personal_email</code> \u5143\u7d20\u662f\u6709\u6548\u7684\u7535\u5b50\u90ae\u4ef6\u5730\u5740, \u4e14 <code>short_bio</code> \u5143\u7d20\u4e0d\u4e3a\u7a7a\u767d\u4e14\u957f\u5ea6\u4e0d\u8d85\u8fc7 100 \u4e2a\u5b57\u7b26, \u53ef\u4ee5\u8fd9\u6837\u5199:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Collection(\n\     *     fields = {\n\     *         "personal_email" = @Assert\\Email,\n\     *         "short_bio" = {\n\     *             @Assert\\NotBlank(),\n\     *             @Assert\\Length(\n\     *                 max = 100,\n\     *                 maxMessage = "Your bio is too long!"\n\     *             )\n\     *         }\n\     *     },\n\     *     allowMissingFields = true\n\     * )\n\     */\n\     protected $profileData = array(\n\         'personal_email',\n\         'short_bio',\n\     );\n\n\    public function setProfileData($key, $value) {\n\        $this->profileData[$key] = $value;\n\    }\n}\n</code></pre><p>\u9ed8\u8ba4\u60c5\u51b5\u4e0b, \u6b64\u7ea6\u675f\u9a8c\u8bc1\u7684\u5185\u5bb9\u4e0d\u4ec5\u4ec5\u662f\u96c6\u5408\u4e2d\u7684\u5404\u4e2a\u5b57\u6bb5\u662f\u5426\u901a\u8fc7\u5176\u6307\u5b9a\u7684\u7ea6\u675f\u3002\u4e8b\u5b9e\u4e0a, \u5982\u679c\u96c6\u5408\u7f3a\u5c11\u4efb\u4f55\u952e, \u6216\u96c6\u5408\u4e2d\u5b58\u5728\u4efb\u4f55\u65e0\u6cd5\u8bc6\u522b\u7684\u952e, \u90fd\u4f1a\u629b\u51fa\u9a8c\u8bc1\u9519\u8bef\u3002</p><p>\u5982\u679c\u4f60\u60f3\u5141\u8bb8\u96c6\u5408\u4e2d\u7f3a\u5c11\u67d0\u4e9b\u952e, \u6216\u8005\u60f3\u5141\u8bb8\u96c6\u5408\u4e2d\u51fa\u73b0 "\u989d\u5916" \u7684\u952e, \u53ef\u4ee5\u5206\u522b\u4fee\u6539 <code>allowMissingFields</code> \u548c <code>allowExtraFields</code> \u9009\u9879\u3002\u5728\u4e0a\u9762\u7684\u793a\u4f8b\u4e2d, <code>allowMissingFields</code> \u9009\u9879\u88ab\u8bbe\u4e3a <code>true</code>, \u8fd9\u610f\u5473\u7740\u5982\u679c <code>$personalData</code> \u5c5e\u6027\u4e2d\u7f3a\u5c11 <code>personal_email</code> \u6216 <code>short_bio</code> \u5143\u7d20, \u4e5f\u4e0d\u4f1a\u4ea7\u751f\u9a8c\u8bc1\u9519\u8bef\u3002</p><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">fields</p><p><strong>\u7c7b\u578b</strong>: <code>array</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u9009\u9879\u662f\u5fc5\u586b\u7684, \u5b83\u662f\u4e00\u4e2a\u5173\u8054\u6570\u7ec4, \u5b9a\u4e49\u96c6\u5408\u4e2d\u7684\u6240\u6709\u952e, \u4ee5\u53ca\u5bf9\u96c6\u5408\u7684\u6bcf\u4e2a\u5143\u7d20\u5e94\u6267\u884c\u54ea\u4e9b\u9a8c\u8bc1\u5668\u3002</p><p style="font-weight: bold; font-style: italic">allowExtraFields</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>false</code></p><p>\u5982\u679c\u6b64\u9009\u9879\u8bbe\u4e3a <code>false</code>, \u4e14\u5e95\u5c42\u96c6\u5408\u5305\u542b\u4e00\u4e2a\u6216\u591a\u4e2a\u672a\u5305\u542b\u5728 <code>fields</code> \u9009\u9879\u4e2d\u7684\u5143\u7d20, \u5219\u4f1a\u8fd4\u56de\u9a8c\u8bc1\u9519\u8bef\u3002\u5982\u679c\u8bbe\u4e3a <code>true</code>, \u5219\u5141\u8bb8\u989d\u5916\u5b57\u6bb5\u3002</p><p style="font-weight: bold; font-style: italic">extraFieldsMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The fields {{ fields }} were not expected</code></p><p>\u5982\u679c <code>allowExtraFields</code> \u4e3a false \u4e14\u68c0\u6d4b\u5230\u989d\u5916\u5b57\u6bb5, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">allowMissingFields</p><p><strong>\u7c7b\u578b</strong>: <code>Boolean</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>false</code></p><p>\u5982\u679c\u6b64\u9009\u9879\u8bbe\u4e3a <code>false</code>, \u4e14 <code>fields</code> \u9009\u9879\u4e2d\u7684\u4e00\u4e2a\u6216\u591a\u4e2a\u5b57\u6bb5\u672a\u51fa\u73b0\u5728\u5e95\u5c42\u96c6\u5408\u4e2d, \u5219\u4f1a\u8fd4\u56de\u9a8c\u8bc1\u9519\u8bef\u3002\u5982\u679c\u8bbe\u4e3a <code>true</code>, \u5219\u5141\u8bb8 <code>fields</code> \u9009\u9879\u4e2d\u7684\u67d0\u4e9b\u5b57\u6bb5\u4e0d\u51fa\u73b0\u5728\u5e95\u5c42\u96c6\u5408\u4e2d\u3002</p><p style="font-weight: bold; font-style: italic">missingFieldsMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The fields {{ fields }} are missing</code></p><p>\u5982\u679c <code>allowMissingFields</code> \u4e3a false \u4e14\u5e95\u5c42\u96c6\u5408\u7f3a\u5c11\u4e00\u4e2a\u6216\u591a\u4e2a\u5b57\u6bb5, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
CountTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Count</p><p style="font-style: italic">New in version 2.1: The <code>Count</code> constraint was added in Symfony 2.1.</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u7ed9\u5b9a\u96c6\u5408 (\u5373\u5b9e\u73b0 Countable \u7684\u6570\u7ec4\u6216\u5bf9\u8c61) \u7684\u5143\u7d20\u6570\u91cf<b>\u4ecb\u4e8e</b>\u67d0\u4e2a\u6700\u5c0f\u503c\u548c\u6700\u5927\u503c\u4e4b\u95f4\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>min</li>            <li>max</li>            <li>minMessage</li>            <li>maxMessage</li>            <li>exactMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Count</code></td></tr><tr>    <td>Validator</td>    <td><code>CountValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u8981\u9a8c\u8bc1 <code>emails</code> \u6570\u7ec4\u5b57\u6bb5\u5305\u542b 1 \u5230 5 \u4e2a\u5143\u7d20, \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Participant {\n\    /**\n\     * @Assert\\Count(\n\     *      min = "1",\n\     *      max = "5",\n\     *      minMessage = "You must specify at least one email",\n\     *      maxMessage = "You cannot specify more than {{ limit }} emails"\n\     * )\n\     */\n\     protected $emails = array();\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">min</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "min" \u6570\u91cf\u503c\u3002\u5982\u679c\u7ed9\u5b9a\u96c6\u5408\u7684\u5143\u7d20\u6570\u91cf<b>\u5c0f\u4e8e</b>\u6b64\u6700\u5c0f\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">max</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f "max" \u6570\u91cf\u503c\u3002\u5982\u679c\u7ed9\u5b9a\u96c6\u5408\u7684\u5143\u7d20\u6570\u91cf<b>\u5927\u4e8e</b>\u6b64\u6700\u5927\u503c, \u9a8c\u8bc1\u5c06\u5931\u8d25\u3002</p><p style="font-weight: bold; font-style: italic">minMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This collection should contain {{ limit }} elements or more.</code></p><p>\u5982\u679c\u5e95\u5c42\u96c6\u5408\u7684\u5143\u7d20\u6570\u91cf\u5c0f\u4e8e <code>min</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">maxMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This collection should contain {{ limit }} elements or less.</code></p><p>\u5982\u679c\u5e95\u5c42\u96c6\u5408\u7684\u5143\u7d20\u6570\u91cf\u5927\u4e8e <code>max</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">exactMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This collection should contain exactly {{ limit }} elements.</code></p><p>\u5982\u679c <code>min</code> \u548c <code>max</code> \u503c\u76f8\u7b49\u4e14\u5e95\u5c42\u96c6\u5408\u7684\u5143\u7d20\u6570\u91cf\u4e0d\u6070\u597d\u7b49\u4e8e\u8be5\u503c, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
UniqueEntityTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@UniqueEntity</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1 Doctrine \u5b9e\u4f53\u4e2d\u7684\u7279\u5b9a\u5b57\u6bb5 (\u6216\u591a\u4e2a\u5b57\u6bb5) \u662f\u552f\u4e00\u7684\u3002\u4f8b\u5982, \u8fd9\u901a\u5e38\u7528\u4e8e\u9632\u6b62\u65b0\u7528\u6237\u4f7f\u7528\u7cfb\u7edf\u4e2d\u5df2\u5b58\u5728\u7684\u7535\u5b50\u90ae\u4ef6\u5730\u5740\u6ce8\u518c\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>class</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>fields</li>            <li>message</li>            <li>em</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>UniqueEntity</code></td></tr><tr>    <td>Validator</td>    <td><code>UniqueEntityValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5047\u8bbe\u4f60\u6709\u4e00\u4e2a <code>AcmeUserBundle</code> \u6346\u7ed1\u5305, \u5176\u4e2d\u5305\u542b\u4e00\u4e2a\u5177\u6709 <code>email</code> \u5b57\u6bb5\u7684 <code>User</code> \u5b9e\u4f53\u3002\u53ef\u4ee5\u4f7f\u7528 <code>UniqueEntity</code> \u7ea6\u675f\u6765\u4fdd\u8bc1 <code>email</code> \u5b57\u6bb5\u5728\u7528\u6237\u8868\u4e2d\u7684\u6240\u6709\u7ea6\u675f\u4e4b\u95f4\u4fdd\u6301\u552f\u4e00:</p><pre><code>\nnamespace Acme\\UserBundle\\Entity;\n\nuse Symfony\\Component\\Validator\\Constraints as Assert;\nuse Doctrine\\ORM\\Mapping as ORM;\n\n// DON'T forget this use statement!!!\nuse Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity;\n\n/**\n * @ORM\\Entity\n * @UniqueEntity("email")\n */\nclass Author {\n\    /**\n\     * @var string $email\n\     *\n\     * @ORM\\Column(name="email", type="string", length=255, unique=true)\n\     * @Assert\\Email()\n\     */\n\    protected $email;\n\n\    // ...\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">fields</p><p><strong>\u7c7b\u578b</strong>: <code>array | string</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f\u6b64\u5b9e\u4f53\u5e94\u5728\u5176\u4e0a\u4fdd\u6301\u552f\u4e00\u7684\u5b57\u6bb5 (\u6216\u5b57\u6bb5\u5217\u8868)\u3002\u4f8b\u5982, \u5982\u679c\u5728\u5355\u4e2a <code>UniqueEntity</code> \u7ea6\u675f\u4e2d\u540c\u65f6\u6307\u5b9a\u4e86 <code>email</code> \u548c <code>name</code> \u5b57\u6bb5, \u5219\u5b83\u5c06\u5f3a\u5236\u7ec4\u5408\u503c\u552f\u4e00 (\u4f8b\u5982, \u4e24\u4e2a\u7528\u6237\u53ef\u4ee5\u6709\u76f8\u540c\u7684\u7535\u5b50\u90ae\u4ef6, \u53ea\u8981\u4ed6\u4eec\u7684\u540d\u5b57\u4e5f\u4e0d\u540c)\u3002</p><p>\u5982\u679c\u9700\u8981\u4e24\u4e2a\u5b57\u6bb5\u5206\u522b\u552f\u4e00 (\u4f8b\u5982\u552f\u4e00\u7684 <code>email</code> \u548c\u552f\u4e00\u7684 <code>username</code>), \u8bf7\u4f7f\u7528\u4e24\u4e2a <code>UniqueEntity</code> \u6761\u76ee, \u6bcf\u4e2a\u6761\u76ee\u53ea\u5305\u542b\u4e00\u4e2a\u5b57\u6bb5\u3002</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is already used.</code></p><p>\u6b64\u7ea6\u675f\u5931\u8d25\u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">em</p><p><strong>\u7c7b\u578b</strong>: <code>string</code></p><p>\u7528\u4e8e\u6267\u884c\u552f\u4e00\u6027\u67e5\u8be2\u7684\u5b9e\u4f53\u7ba1\u7406\u5668\u540d\u79f0\u3002\u5982\u679c\u7559\u7a7a, \u5c06\u4e3a\u6b64\u7c7b\u786e\u5b9a\u6b63\u786e\u7684\u5b9e\u4f53\u7ba1\u7406\u5668\u3002\u56e0\u6b64, \u901a\u5e38\u4e0d\u9700\u8981\u4f7f\u7528\u6b64\u9009\u9879\u3002</p>
LanguageTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Language</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684\u8bed\u8a00\u4ee3\u7801\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Language</code></td></tr><tr>    <td>Validator</td>    <td><code>LanguageValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass User {\n\    /**\n\     * @Assert\\Language\n\     */\n\     protected $preferredLanguage;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid language</code></p><p>\u5982\u679c\u5b57\u7b26\u4e32\u4e0d\u662f\u6709\u6548\u7684\u8bed\u8a00\u4ee3\u7801, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
LocaleTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Locale</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684\u533a\u57df\u8bbe\u7f6e (locale)\u3002</p><p>\u6bcf\u4e2a\u533a\u57df\u8bbe\u7f6e\u7684 "\u503c" \u662f\u4e24\u4e2a\u5b57\u6bcd\u7684 ISO639-1 \u8bed\u8a00\u4ee3\u7801 (\u4f8b\u5982 fr), \u6216\u8005\u8bed\u8a00\u4ee3\u7801\u540e\u8ddf\u4e0b\u5212\u7ebf (_) \u548c ISO3166 \u56fd\u5bb6/\u5730\u533a\u4ee3\u7801 (\u4f8b\u5982\u6cd5\u8bed/\u6cd5\u56fd\u4e3a fr_FR)\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Locale</code></td></tr><tr>    <td>Validator</td>    <td><code>LocaleValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass User {\n\    /**\n\     * @Assert\\Locale\n\     */\n\     protected $locale;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid locale</code></p><p>\u5982\u679c\u5b57\u7b26\u4e32\u4e0d\u662f\u6709\u6548\u7684\u533a\u57df\u8bbe\u7f6e, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
CountryTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Country</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684\u4e24\u4e2a\u5b57\u6bcd\u7684\u56fd\u5bb6/\u5730\u533a\u4ee3\u7801\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Country</code></td></tr><tr>    <td>Validator</td>    <td><code>CountryValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass User {\n\    /**\n\     * @Assert\\Country\n\     */\n\     protected $country;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value is not a valid country</code></p><p>\u5982\u679c\u5b57\u7b26\u4e32\u4e0d\u662f\u6709\u6548\u7684\u56fd\u5bb6/\u5730\u533a\u4ee3\u7801, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
FileTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@File</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u9a8c\u8bc1\u503c\u662f\u6709\u6548\u7684 "\u6587\u4ef6", \u5b83\u53ef\u4ee5\u662f\u4ee5\u4e0b\u4e4b\u4e00:<ul><li>\u6307\u5411\u73b0\u6709\u6587\u4ef6\u7684\u5b57\u7b26\u4e32\u8def\u5f84 (\u6216\u5177\u6709 <code>__toString()</code> \u65b9\u6cd5\u7684\u5bf9\u8c61);</li><li>\u6709\u6548\u7684 <code>File</code> \u5bf9\u8c61 (\u5305\u62ec <code>UploadedFile</code> \u7c7b\u7684\u5bf9\u8c61)\u3002</li></ul>\u6b64\u7ea6\u675f\u901a\u5e38\u4e0e <code>file</code> \u8868\u5355\u7c7b\u578b\u4e00\u8d77\u5728\u8868\u5355\u4e2d\u4f7f\u7528\u3002</p><p style="font-style: italic">If the file you're validating is an image, try the <code>Image</code> constraint.</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>maxSize</li>            <li>mimeTypes</li>            <li>maxSizeMessage</li>            <li>mimeTypesMessage</li>            <li>notFoundMessage</li>            <li>notReadableMessage</li>            <li>uploadIniSizeErrorMessage</li>            <li>uploadFormSizeErrorMessage</li>            <li>uploadErrorMessage</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>File</code></td></tr><tr>    <td>Validator</td>    <td><code>FileValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6b64\u7ea6\u675f\u6700\u5e38\u7528\u4e8e\u5c06\u5728\u8868\u5355\u4e2d\u5448\u73b0\u4e3a\u6587\u4ef6\u8868\u5355\u7c7b\u578b\u7684\u5c5e\u6027\u3002\u4f8b\u5982, \u5047\u8bbe\u4f60\u6b63\u5728\u521b\u5efa\u4e00\u4e2a\u4f5c\u8005\u8868\u5355, \u53ef\u4ee5\u4e3a\u4f5c\u8005\u4e0a\u4f20 "\u7b80\u4ecb" PDF\u3002\u5728\u8868\u5355\u4e2d, <code>bioFile</code> \u5c5e\u6027\u5c06\u662f\u6587\u4ef6\u7c7b\u578b\u3002\u4e3a\u4fdd\u8bc1 <code>bioFile</code> <code>File</code> \u5bf9\u8c61\u6709\u6548, \u4e14\u5176\u5927\u5c0f\u4f4e\u4e8e\u67d0\u4e2a\u9650\u5236\u5e76\u4e14\u662f\u6709\u6548\u7684 PDF, \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\HttpFoundation\\File\\File;\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\File(\n\     *     maxSize = "1024k",\n\     *     mimeTypes = {"application/pdf", "application/x-pdf"},\n\     *     mimeTypesMessage = "Please upload a valid PDF"\n\     * )\n\     */\n\    protected $bioFile;\n}\n</code></pre><p><code>bioFile</code> \u5c5e\u6027\u7ecf\u8fc7\u9a8c\u8bc1\u4ee5\u4fdd\u8bc1\u5b83\u662f\u4e00\u4e2a\u771f\u5b9e\u6587\u4ef6\u3002\u7531\u4e8e\u6307\u5b9a\u4e86\u76f8\u5e94\u9009\u9879, \u5176\u5927\u5c0f\u548c MIME \u7c7b\u578b\u4e5f\u4f1a\u88ab\u9a8c\u8bc1\u3002</p><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">maxSize</p><p><strong>\u7c7b\u578b</strong>: <code>mixed</code></p><p>\u5982\u679c\u8bbe\u7f6e, \u5e95\u5c42\u6587\u4ef6\u7684\u5927\u5c0f\u5fc5\u987b\u4f4e\u4e8e\u6b64\u6587\u4ef6\u5927\u5c0f\u624d\u80fd\u6709\u6548\u3002\u6587\u4ef6\u5927\u5c0f\u53ef\u4ee5\u91c7\u7528\u4ee5\u4e0b\u683c\u5f0f\u4e4b\u4e00\u7ed9\u51fa:<ul><li><b>\u5b57\u8282</b>: \u8981\u4ee5\u5b57\u8282\u4e3a\u5355\u4f4d\u6307\u5b9a <code>maxSize</code>, \u8bf7\u4f20\u5165\u5b8c\u5168\u7531\u6570\u5b57\u7ec4\u6210\u7684\u503c (\u4f8b\u5982 <code>4096</code>);</li><li><b>\u5343\u5b57\u8282</b>: \u8981\u4ee5\u5343\u5b57\u8282\u4e3a\u5355\u4f4d\u6307\u5b9a <code>maxSize</code>, \u8bf7\u4f20\u5165\u6570\u5b57\u5e76\u52a0\u4e0a\u5c0f\u5199 "k" \u540e\u7f00 (\u4f8b\u5982 <code>200k</code>);</li><li><b>\u5146\u5b57\u8282</b>: \u8981\u4ee5\u5146\u5b57\u8282\u4e3a\u5355\u4f4d\u6307\u5b9a <code>maxSize</code>, \u8bf7\u4f20\u5165\u6570\u5b57\u5e76\u52a0\u4e0a\u5927\u5199 "M" \u540e\u7f00 (\u4f8b\u5982 <code>4M</code>)\u3002</li></ul></p><p style="font-weight: bold; font-style: italic">mimeTypes</p><p><strong>\u7c7b\u578b</strong>: <code>array | string</code></p><p>\u5982\u679c\u8bbe\u7f6e, \u9a8c\u8bc1\u5668\u5c06\u68c0\u67e5\u5e95\u5c42\u6587\u4ef6\u7684 MIME \u7c7b\u578b\u662f\u5426\u7b49\u4e8e\u7ed9\u5b9a\u7684 MIME \u7c7b\u578b (\u5982\u679c\u4e3a\u5b57\u7b26\u4e32), \u6216\u5b58\u5728\u4e8e\u7ed9\u5b9a\u7684 MIME \u7c7b\u578b\u96c6\u5408\u4e2d (\u5982\u679c\u4e3a\u6570\u7ec4)\u3002</p><p>\u53ef\u4ee5\u5728 IANA \u7f51\u7ad9\u4e0a\u627e\u5230\u73b0\u6709 MIME \u7c7b\u578b\u7684\u5217\u8868\u3002</p><p style="font-weight: bold; font-style: italic">maxSizeMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The file is too large ({{ size }}). Allowed maximum size is {{ limit }}</code></p><p>\u5982\u679c\u6587\u4ef6\u5927\u4e8e <code>maxSize</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">mimeTypesMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The mime type of the file is invalid ({{ type }}). Allowed mime types are {{ types }}</code></p><p>\u5982\u679c\u6587\u4ef6\u7684 MIME \u7c7b\u578b\u4e0d\u7b26\u5408 <code>mimeTypes</code> \u9009\u9879, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">notFoundMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The file could not be found</code></p><p>\u5982\u679c\u5728\u7ed9\u5b9a\u8def\u5f84\u627e\u4e0d\u5230\u6587\u4ef6, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002\u4ec5\u5f53\u5e95\u5c42\u503c\u662f\u5b57\u7b26\u4e32\u8def\u5f84\u65f6\u624d\u53ef\u80fd\u51fa\u73b0\u6b64\u9519\u8bef, \u56e0\u4e3a\u65e0\u6cd5\u7528\u65e0\u6548\u7684\u6587\u4ef6\u8def\u5f84\u6784\u9020 <code>File</code> \u5bf9\u8c61\u3002</p><p style="font-weight: bold; font-style: italic">notReadableMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The file is not readable</code></p><p>\u5982\u679c\u6587\u4ef6\u5b58\u5728, \u4f46 PHP <code>is_readable</code> \u51fd\u6570\u5728\u4f20\u5165\u6587\u4ef6\u8def\u5f84\u65f6\u5931\u8d25, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">uploadIniSizeErrorMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The file is too large. Allowed maximum size is {{ limit }}</code></p><p>\u5982\u679c\u4e0a\u4f20\u7684\u6587\u4ef6\u5927\u4e8e PHP.ini \u4e2d\u7684 <code>upload_max_filesize</code> \u8bbe\u7f6e, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">uploadFormSizeErrorMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The file is too large</code></p><p>\u5982\u679c\u4e0a\u4f20\u7684\u6587\u4ef6\u5927\u4e8e HTML \u6587\u4ef6\u8f93\u5165\u5b57\u6bb5\u6240\u5141\u8bb8\u7684\u5927\u5c0f, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">uploadErrorMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The file could not be uploaded</code></p><p>\u5982\u679c\u7531\u4e8e\u672a\u77e5\u539f\u56e0 (\u4f8b\u5982\u4e0a\u4f20\u5931\u8d25\u6216\u65e0\u6cd5\u5199\u5165\u78c1\u76d8) \u65e0\u6cd5\u4e0a\u4f20\u6587\u4ef6, \u5219\u663e\u793a\u6b64\u6d88\u606f\u3002</p>
ImageTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Image</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p><code>Image</code> \u7ea6\u675f\u7684\u5de5\u4f5c\u65b9\u5f0f\u4e0e <code>File</code> \u7ea6\u675f\u5b8c\u5168\u76f8\u540c, \u53ea\u662f\u5b83\u7684 <code>mimeTypes</code> \u548c <code>mimeTypesMessage</code> \u9009\u9879\u4f1a\u81ea\u52a8\u8bbe\u7f6e\u4e3a\u4e13\u95e8\u9488\u5bf9\u56fe\u50cf\u6587\u4ef6\u5de5\u4f5c\u3002</p><p>\u6b64\u5916, \u4ece Symfony 2.1 \u8d77, \u5b83\u8fd8\u63d0\u4f9b\u4e86\u4e00\u4e9b\u9009\u9879, \u53ef\u4ee5\u9488\u5bf9\u56fe\u50cf\u7684\u5bbd\u5ea6\u548c\u9ad8\u5ea6\u8fdb\u884c\u9a8c\u8bc1\u3002</p><p>\u5173\u4e8e\u6b64\u7ea6\u675f\u7684\u5927\u90e8\u5206\u6587\u6863, \u53c2\u89c1 <code>File</code> \u7ea6\u675f\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>mimeTypes</li>            <li>minWidth</li>            <li>maxWidth</li>            <li>maxHeight</li>            <li>minHeight</li>            <li>mimeTypesMessage</li>            <li>sizeNotDetectedMessage</li>            <li>maxWidthMessage</li>            <li>minWidthMessage</li>            <li>maxHeightMessage</li>            <li>minHeightMessage</li>            <li>See <code>File</code> for inherited options</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>File</code></td></tr><tr>    <td>Validator</td>    <td><code>FileValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6b64\u7ea6\u675f\u6700\u5e38\u7528\u4e8e\u5c06\u5728\u8868\u5355\u4e2d\u5448\u73b0\u4e3a\u6587\u4ef6\u8868\u5355\u7c7b\u578b\u7684\u5c5e\u6027\u3002\u4f8b\u5982, \u5047\u8bbe\u4f60\u6b63\u5728\u521b\u5efa\u4e00\u4e2a\u4f5c\u8005\u8868\u5355, \u53ef\u4ee5\u4e3a\u4f5c\u8005\u4e0a\u4f20 "\u5934\u50cf" \u56fe\u50cf\u3002\u5728\u8868\u5355\u4e2d, <code>headshot</code> \u5c5e\u6027\u5c06\u662f <code>file</code> \u7c7b\u578b\u3002\u4e3a\u4fdd\u8bc1 <code>headshot</code> <code>File</code> \u5bf9\u8c61\u662f\u6709\u6548\u7684\u56fe\u50cf\u4e14\u5c3a\u5bf8\u4ecb\u4e8e\u67d0\u4e2a\u8303\u56f4\u4e4b\u95f4, \u53ef\u4ee5\u6dfb\u52a0\u4ee5\u4e0b\u5185\u5bb9:</p><pre><code>\nuse Symfony\\Component\\HttpFoundation\\File\\File;\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\Image(\n\     *     minWidth = 200,\n\     *     maxWidth = 400,\n\     *     minHeight = 200,\n\     *     maxHeight = 400\n\     * )\n\     */\n\    protected $headshot;\n}\n</code></pre><p><code>headshot</code> \u5c5e\u6027\u7ecf\u8fc7\u9a8c\u8bc1\u4ee5\u4fdd\u8bc1\u5b83\u662f\u771f\u5b9e\u56fe\u50cf, \u4e14\u5bbd\u5ea6\u548c\u9ad8\u5ea6\u4ecb\u4e8e\u67d0\u4e2a\u8303\u56f4\u4e4b\u95f4\u3002</p><p style="font-weight: bold; font-size: 1.1em">Options</p><p>\u6b64\u7ea6\u675f\u4e0e <code>File</code> \u7ea6\u675f\u5171\u4eab\u6240\u6709\u9009\u9879\u3002\u4e0d\u8fc7, \u5b83\u4fee\u6539\u4e86\u4e24\u4e2a\u9ed8\u8ba4\u9009\u9879\u503c, \u5e76\u6dfb\u52a0\u4e86\u82e5\u5e72\u5176\u4ed6\u9009\u9879\u3002</p><p style="font-weight: bold; font-style: italic">mimeTypes</p><p><strong>\u7c7b\u578b</strong>: <code>array | string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>image/*</code></p><p>\u53ef\u4ee5\u5728 IANA \u7f51\u7ad9\u4e0a\u627e\u5230\u73b0\u6709 MIME \u7c7b\u578b\u7684\u5217\u8868\u3002</p><p style="font-weight: bold; font-style: italic">mimeTypesMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This file is not a valid image</code></p><p style="font-weight: bold; font-style: italic">New in version 2.1: All of the min/max width/height options are new to Symfony 2.1.</p><p style="font-weight: bold; font-style: italic">minWidth</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code></p><p>\u5982\u679c\u8bbe\u7f6e, \u56fe\u50cf\u6587\u4ef6\u7684\u5bbd\u5ea6\u5fc5\u987b\u5927\u4e8e\u6216\u7b49\u4e8e\u6b64\u503c (\u4ee5\u50cf\u7d20\u4e3a\u5355\u4f4d)\u3002</p><p style="font-weight: bold; font-style: italic">maxWidth</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code></p><p>\u5982\u679c\u8bbe\u7f6e, \u56fe\u50cf\u6587\u4ef6\u7684\u5bbd\u5ea6\u5fc5\u987b\u5c0f\u4e8e\u6216\u7b49\u4e8e\u6b64\u503c (\u4ee5\u50cf\u7d20\u4e3a\u5355\u4f4d)\u3002</p><p style="font-weight: bold; font-style: italic">minHeight</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code></p><p>\u5982\u679c\u8bbe\u7f6e, \u56fe\u50cf\u6587\u4ef6\u7684\u9ad8\u5ea6\u5fc5\u987b\u5927\u4e8e\u6216\u7b49\u4e8e\u6b64\u503c (\u4ee5\u50cf\u7d20\u4e3a\u5355\u4f4d)\u3002</p><p style="font-weight: bold; font-style: italic">maxHeight</p><p><strong>\u7c7b\u578b</strong>: <code>integer</code></p><p>\u5982\u679c\u8bbe\u7f6e, \u56fe\u50cf\u6587\u4ef6\u7684\u9ad8\u5ea6\u5fc5\u987b\u5c0f\u4e8e\u6216\u7b49\u4e8e\u6b64\u503c (\u4ee5\u50cf\u7d20\u4e3a\u5355\u4f4d)\u3002</p><p style="font-weight: bold; font-style: italic">sizeNotDetectedMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The size of the image could not be detected</code></p><p>\u5982\u679c\u7cfb\u7edf\u65e0\u6cd5\u786e\u5b9a\u56fe\u50cf\u7684\u5927\u5c0f, \u5c06\u663e\u793a\u6b64\u9519\u8bef\u3002\u53ea\u6709\u5f53\u56db\u4e2a\u5c3a\u5bf8\u7ea6\u675f\u9009\u9879\u4e2d\u81f3\u5c11\u6709\u4e00\u4e2a\u88ab\u8bbe\u7f6e\u65f6\u624d\u4f1a\u53d1\u751f\u3002</p><p style="font-weight: bold; font-style: italic">maxWidthMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The image width is too big ({{ width }}px). Allowed maximum width is {{ max_width }}px</code></p><p>\u5f53\u56fe\u50cf\u5bbd\u5ea6\u8d85\u8fc7 <code>maxWidth</code> \u65f6\u7684\u9519\u8bef\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">minWidthMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</strong> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The image width is too small ({{ width }}px). Minimum width expected is {{ min_width }}px</code></p><p>\u5f53\u56fe\u50cf\u5bbd\u5ea6\u5c0f\u4e8e <code>minWidth</code> \u65f6\u7684\u9519\u8bef\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">maxHeightMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The image height is too big ({{ height }}px). Allowed maximum height is {{ max_height }}px</code></p><p>\u5f53\u56fe\u50cf\u9ad8\u5ea6\u8d85\u8fc7 <code>maxHeight</code> \u65f6\u7684\u9519\u8bef\u6d88\u606f\u3002</p><p style="font-weight: bold; font-style: italic">minHeightMessage</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>The image height is too small ({{ height }}px). Minimum height expected is {{ min_height }}px</code></p><p>\u5f53\u56fe\u50cf\u9ad8\u5ea6\u5c0f\u4e8e <code>minHeight</code> \u65f6\u7684\u9519\u8bef\u6d88\u606f\u3002</p>
CallbackTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Callback</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>Callback \u65ad\u8a00\u7684\u76ee\u7684\u662f\u8ba9\u4f60\u521b\u5efa\u5b8c\u5168\u81ea\u5b9a\u4e49\u7684\u9a8c\u8bc1\u89c4\u5219, \u5e76\u5c06\u4efb\u4f55\u9a8c\u8bc1\u9519\u8bef\u6307\u5b9a\u5230\u5bf9\u8c61\u7684\u7279\u5b9a\u5b57\u6bb5\u3002\u5982\u679c\u4f60\u5728\u8868\u5355\u4e2d\u4f7f\u7528\u9a8c\u8bc1, \u8fd9\u610f\u5473\u7740\u53ef\u4ee5\u8ba9\u8fd9\u4e9b\u81ea\u5b9a\u4e49\u9519\u8bef\u663e\u793a\u5728\u7279\u5b9a\u5b57\u6bb5\u65c1\u8fb9, \u800c\u4e0d\u662f\u7b80\u5355\u5730\u5728\u8868\u5355\u9876\u90e8\u663e\u793a\u3002</p><p>\u6b64\u8fc7\u7a0b\u901a\u8fc7\u6307\u5b9a\u4e00\u4e2a\u6216\u591a\u4e2a<i>\u56de\u8c03</i>\u65b9\u6cd5\u6765\u5de5\u4f5c, \u6bcf\u4e2a\u65b9\u6cd5\u90fd\u4f1a\u5728\u9a8c\u8bc1\u8fc7\u7a0b\u4e2d\u88ab\u8c03\u7528\u3002\u8fd9\u4e9b\u65b9\u6cd5\u53ef\u4ee5\u505a\u4efb\u4f55\u4e8b\u60c5, \u5305\u62ec\u521b\u5efa\u548c\u6307\u5b9a\u9a8c\u8bc1\u9519\u8bef\u3002</p><p style="font-style: italic">A callback method itself doesn't <i>fail</i> or return any value. Instead, as you'll see in the example, a callback method has the ability to directly add validator "violations".</p><table border="0"><tr>    <td>Applies to</td>    <td>class</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>methods</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Callback</code></td></tr><tr>    <td>Validator</td>    <td><code>CallbackValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u56de\u8c03\u65b9\u6cd5\u4f1a\u6536\u5230\u4e00\u4e2a\u7279\u6b8a\u7684 <code>ExecutionContext</code> \u5bf9\u8c61\u3002\u53ef\u4ee5\u76f4\u63a5\u5728\u6b64\u5bf9\u8c61\u4e0a\u8bbe\u7f6e "\u8fdd\u89c4" (violations), \u5e76\u786e\u5b9a\u8fd9\u4e9b\u9519\u8bef\u5e94\u5f52\u56e0\u4e8e\u54ea\u4e2a\u5b57\u6bb5:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\n/**\n\ * @Assert\\Callback(methods={"isAuthorValid"})\n\ */\nclass Author {\n\    // ...\n\    private $firstName;\n\n\    public function isAuthorValid(ExecutionContext $context) {\n\        // somehow you have an array of "fake names"\n\        $fakeNames = array();\n\n\        // check if the name is actually a fake name\n\        if (in_array($this->getFirstName(), $fakeNames)) {\n\            $context->addViolationAtSubPath('firstname', 'This name sounds totally fake!', array(), null);\n\        }\n\    }\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">methods</p><p><strong>\u7c7b\u578b</strong>: <code>array</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>array()</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u8fd9\u662f\u5e94\u5728\u9a8c\u8bc1\u8fc7\u7a0b\u4e2d\u6267\u884c\u7684\u65b9\u6cd5\u6570\u7ec4\u3002\u6bcf\u4e2a\u65b9\u6cd5\u53ef\u4ee5\u662f\u4ee5\u4e0b\u683c\u5f0f\u4e4b\u4e00:</p><ol><li><p><strong>\u5b57\u7b26\u4e32\u65b9\u6cd5\u540d</strong></p><blockquote><p>\u5982\u679c\u65b9\u6cd5\u540d\u662f\u4e00\u4e2a\u7b80\u5355\u5b57\u7b26\u4e32 (\u4f8b\u5982 <code>isAuthorValid</code>), \u8be5\u65b9\u6cd5\u5c06\u5728\u88ab\u9a8c\u8bc1\u7684\u540c\u4e00\u5bf9\u8c61\u4e0a\u8c03\u7528, \u5e76\u4e14 <code>ExecutionContext</code> \u662f\u552f\u4e00\u7684\u53c2\u6570 (\u53c2\u89c1\u4e0a\u9762\u7684\u793a\u4f8b)\u3002</p></blockquote></li><li><p><strong>\u9759\u6001\u6570\u7ec4\u56de\u8c03</strong></p><blockquote><p>\u6bcf\u4e2a\u65b9\u6cd5\u4e5f\u53ef\u4ee5\u6307\u5b9a\u4e3a\u6807\u51c6\u7684\u6570\u7ec4\u56de\u8c03:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\n/**\n\ * @Assert\\Callback(methods={\n\ *     { "Acme\\BlogBundle\\MyStaticValidatorClass", "isAuthorValid"}\n\ * })\n\ */\nclass Author {\n}\n</code></pre><p>\u5728\u6b64\u60c5\u51b5\u4e0b, \u9759\u6001\u65b9\u6cd5 <code>isAuthorValid</code> \u5c06\u5728 <code>Acme\\BlogBundle\\MyStaticValidatorClass</code> \u7c7b\u4e0a\u8c03\u7528\u3002\u5b83\u4f1a\u540c\u65f6\u6536\u5230\u88ab\u9a8c\u8bc1\u7684\u539f\u59cb\u5bf9\u8c61 (\u4f8b\u5982 <code>Author</code>) \u548c <code>ExecutionContext</code>:</p><pre><code>\nnamespace Acme\\BlogBundle;\n\nuse Symfony\\Component\\Validator\\ExecutionContext;\nuse Acme\\BlogBundle\\Entity\\Author;\n\nclass MyStaticValidatorClass {\n\    static public function isAuthorValid(Author $author, ExecutionContext $context) {\n\        // ...\n\    }\n}\n</code></pre><p>\u5982\u679c\u901a\u8fc7 PHP \u6307\u5b9a <code>Callback</code> \u7ea6\u675f, \u8fd8\u53ef\u4ee5\u9009\u62e9\u8ba9\u56de\u8c03\u6210\u4e3a PHP \u95ed\u5305\u6216\u975e\u9759\u6001\u56de\u8c03\u3002\u4f46\u76ee\u524d\u65e0\u6cd5\u5c06\u670d\u52a1\u6307\u5b9a\u4e3a\u7ea6\u675f\u3002\u8981\u901a\u8fc7\u670d\u52a1\u8fdb\u884c\u9a8c\u8bc1, \u5e94\u521b\u5efa\u4e00\u4e2a\u81ea\u5b9a\u4e49\u9a8c\u8bc1\u7ea6\u675f, \u5e76\u5c06\u8be5\u65b0\u7ea6\u675f\u6dfb\u52a0\u5230\u4f60\u7684\u7c7b\u4e2d\u3002</p>
AllTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@All</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u5e94\u7528\u4e8e\u6570\u7ec4 (\u6216 <code>Traversable</code> \u5bf9\u8c61) \u65f6, \u6b64\u7ea6\u675f\u5141\u8bb8\u4f60\u5bf9\u6570\u7ec4\u7684\u6bcf\u4e2a\u5143\u7d20\u5e94\u7528\u4e00\u7ec4\u7ea6\u675f\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>constraints</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>All</code></td></tr><tr>    <td>Validator</td>    <td><code>AllValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5047\u8bbe\u4f60\u6709\u4e00\u4e2a\u5b57\u7b26\u4e32\u6570\u7ec4, \u60f3\u8981\u9a8c\u8bc1\u6570\u7ec4\u4e2d\u7684\u6bcf\u4e00\u9879:</p><pre><code>\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass User {\n\    /**\n\     * @Assert\\All({\n\     *     @Assert\\NotBlank\n\     *     @Assert\\Length(min = "5"),\n\     * })\n\     */\n\     protected $favoriteColors = array();\n}\n</code></pre><p>\u73b0\u5728, <code>favoriteColors</code> \u6570\u7ec4\u4e2d\u7684\u6bcf\u4e00\u9879\u90fd\u5c06\u88ab\u9a8c\u8bc1\u4e3a\u4e0d\u4e3a\u7a7a\u767d\u4e14\u957f\u5ea6\u81f3\u5c11\u4e3a 5 \u4e2a\u5b57\u7b26\u3002</p><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">constraints</p><p><strong>\u7c7b\u578b</strong>: <code>array</code> [\u9ed8\u8ba4\u9009\u9879]</p><p>\u6b64\u5fc5\u586b\u9009\u9879\u662f\u8981\u5e94\u7528\u4e8e\u5e95\u5c42\u6570\u7ec4\u6bcf\u4e2a\u5143\u7d20\u7684\u9a8c\u8bc1\u7ea6\u675f\u6570\u7ec4\u3002</p>
UserPasswordTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@UserPassword</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p style="font-style: italic">New in version 2.1: This constraint is new in version 2.1.</p><p>\u6b64\u9a8c\u8bc1\u7528\u4e8e\u9a8c\u8bc1\u8f93\u5165\u503c\u662f\u5426\u7b49\u4e8e\u5f53\u524d\u5df2\u8ba4\u8bc1\u7528\u6237\u7684\u5bc6\u7801\u3002\u8fd9\u5728\u7528\u6237\u53ef\u4ee5\u66f4\u6539\u5bc6\u7801\u4f46\u51fa\u4e8e\u5b89\u5168\u8003\u8651\u9700\u8981\u8f93\u5165\u65e7\u5bc6\u7801\u7684\u8868\u5355\u4e2d\u975e\u5e38\u6709\u7528\u3002</p><p style="font-style: italic">This should <b>not</b> be used to validate a login form, since this is done automatically by the security system.</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>message</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>UserPassword</code></td></tr><tr>    <td>Validator</td>    <td><code>UserPasswordValidator</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5047\u8bbe\u4f60\u6709\u4e00\u4e2a PasswordChange \u7c7b, \u7528\u4e8e\u7528\u6237\u53ef\u4ee5\u901a\u8fc7\u8f93\u5165\u65e7\u5bc6\u7801\u548c\u65b0\u5bc6\u7801\u6765\u66f4\u6539\u5bc6\u7801\u7684\u8868\u5355\u3002\u6b64\u7ea6\u675f\u5c06\u9a8c\u8bc1\u65e7\u5bc6\u7801\u662f\u5426\u4e0e\u7528\u6237\u5f53\u524d\u7684\u5bc6\u7801\u5339\u914d:</p><pre><code>\nuse Symfony\\Component\\Security\\Core\\Validator\\Constraint as SecurityAssert;\n\nclass ChangePassword {\n\    /**\n\     * @SecurityAssert\\UserPassword(\n\     *     message = "Wrong value for your current password"\n\     * )\n\     */\n\     protected $oldPassword;\n}\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">message</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>This value should be the user current password</code></p><p>\u8fd9\u662f\u5f53\u5e95\u5c42\u5b57\u7b26\u4e32<b>\u4e0d</b>\u5339\u914d\u5f53\u524d\u7528\u6237\u5bc6\u7801\u65f6\u663e\u793a\u7684\u6d88\u606f\u3002</p>
ValidTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Valid</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6b64\u7ea6\u675f\u7528\u4e8e\u5bf9\u4f5c\u4e3a\u5c5e\u6027\u5d4c\u5165\u5230\u88ab\u9a8c\u8bc1\u5bf9\u8c61\u4e2d\u7684\u5bf9\u8c61\u542f\u7528\u9a8c\u8bc1\u3002\u8fd9\u5141\u8bb8\u4f60\u9a8c\u8bc1\u4e00\u4e2a\u5bf9\u8c61\u53ca\u5176\u6240\u6709\u5173\u8054\u7684\u5b50\u5bf9\u8c61\u3002</p><table border="0"><tr>    <td>Applies to</td>    <td>property or method</td></tr><tr>    <td valign="top">Options</td>    <td><ul style="margin:0 0 0 10px;">            <li>traverse</li>        </ul></td></tr><tr>    <td>Class</td>    <td><code>Type</code></td></tr></table><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u5728\u4e0b\u9762\u7684\u793a\u4f8b\u4e2d, \u521b\u5efa\u4e24\u4e2a\u7c7b <code>Author</code> \u548c <code>Address</code>, \u5b83\u4eec\u7684\u5c5e\u6027\u4e0a\u90fd\u6709\u7ea6\u675f\u3002\u6b64\u5916, <code>Author</code> \u5728 <code>address</code> \u5c5e\u6027\u4e2d\u5b58\u50a8\u4e00\u4e2a <code>Address</code> \u5b9e\u4f8b\u3002</p><pre><code>\n// src/Acme/HelloBundle/Entity/Address.php\nnamespace Acme\\HelloBundle\\Entity;\n\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Address {\n\    /**\n\     * @Assert\\NotBlank()\n\     */\n\    protected $street;\n\n\    /**\n\     * @Assert\\NotBlank\n\     * @Assert\\Length(max = "5")\n\     */\n\    protected $zipCode;\n}\n\n// src/Acme/HelloBundle/Entity/Author.php\nnamespace Acme\\HelloBundle\Entity;\n\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /**\n\     * @Assert\\NotBlank\n\     * @Assert\\Length(min = "4")\n\     */\n\    protected $firstName;\n\n\    /**\n\     * @Assert\\NotBlank\n\     */\n\    protected $lastName;\n\n\    protected $address;\n}\n</code></pre><p>\u4f7f\u7528\u6b64\u6620\u5c04, \u4ecd\u7136\u53ef\u4ee5\u6210\u529f\u9a8c\u8bc1\u5e26\u6709\u65e0\u6548\u5730\u5740\u7684\u4f5c\u8005\u3002\u4e3a\u9632\u6b62\u8fd9\u79cd\u60c5\u51b5, \u8bf7\u5c06 <code>Valid</code> \u7ea6\u675f\u6dfb\u52a0\u5230 <code>address</code> \u5c5e\u6027\u3002</p><pre><code>\n// src/Acme/HelloBundle/Author.php\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nclass Author {\n\    /* ... */\n\n\    /**\n\     * @Assert\\Valid\n\     */\n\    protected $address;\n}\n</code></pre><p>\u5982\u679c\u4f60\u73b0\u5728\u9a8c\u8bc1\u5e26\u6709\u65e0\u6548\u5730\u5740\u7684\u4f5c\u8005, \u53ef\u4ee5\u770b\u5230 Address \u5b57\u6bb5\u7684\u9a8c\u8bc1\u5931\u8d25\u4e86\u3002</p><p>AcmeHelloBundleAuthor.address.zipCode: This value is too long. It should have 5 characters or less</p><p style="font-weight: bold; font-size: 1.1em">Options</p><p style="font-weight: bold; font-style: italic">traverse</p><p><strong>\u7c7b\u578b</strong>: <code>string</code> <strong>\u9ed8\u8ba4\u503c</strong>: <code>true</code></p><p>\u5982\u679c\u6b64\u7ea6\u675f\u5e94\u7528\u4e8e\u4fdd\u5b58\u5bf9\u8c61\u6570\u7ec4\u7684\u5c5e\u6027, \u5219\u53ea\u6709\u5728\u6b64\u9009\u9879\u8bbe\u4e3a <code>true</code> \u65f6, \u8be5\u6570\u7ec4\u4e2d\u7684\u6bcf\u4e2a\u5bf9\u8c61\u624d\u4f1a\u88ab\u9a8c\u8bc1\u3002</p>

