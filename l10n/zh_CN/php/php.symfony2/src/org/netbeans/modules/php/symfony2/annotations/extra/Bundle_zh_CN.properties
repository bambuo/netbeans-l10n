\n# \u4ece\u63a7\u5236\u5668\u7c7b\u5bfc\u5165\u8def\u7531\npost:\n    resource: "@SensioBlogBundle/Controller/PostController.php"\n    type:     annotation\n</code></pre>\n<p>\u8fd8\u53ef\u4ee5\u5bfc\u5165\u6574\u4e2a\u76ee\u5f55\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n# \u4ece\u63a7\u5236\u5668\u76ee\u5f55\u5bfc\u5165\u8def\u7531\nblog:\n    resource: "@SensioBlogBundle/Controller"\n    type:     annotation\n</code></pre>\n<p>\u5bf9\u4e8e\u4efb\u610f\u5176\u4ed6\u8d44\u6e90, \u53ef\u4ee5\u5c06\u8def\u7531 "\u88c5\u8f7d" \u5728\u7ed9\u5b9a\u524d\u7f00\u4e0b\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\npost:\n    resource: "@SensioBlogBundle/Controller/PostController.php"\n    prefix:   /blog\n    type:     annotation\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">\u8def\u7531\u540d\u79f0</p><p>\u4f7f\u7528 <code>@Route</code> \u6807\u6ce8\u5b9a\u4e49\u7684\u8def\u7531\u5c06\u88ab\u8d4b\u4e88\u7531\u5305\u540d\u79f0, \u63a7\u5236\u5668\u540d\u79f0\u548c\u64cd\u4f5c\u540d\u79f0\u7ec4\u6210\u7684\u9ed8\u8ba4\u540d\u79f0\u3002\u4e0a\u4f8b\u4e2d\u7684\u8be5\u540d\u79f0\u5c06\u4e3a <code>sensio_blog_post_index</code>\u3002</p><p><code>name</code> \u5c5e\u6027\u53ef\u7528\u4e8e\u8986\u76d6\u6b64\u9ed8\u8ba4\u8def\u7531\u540d\u79f0\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n * @Route("/", name="blog_home")\n */\npublic function indexAction() {\n    // ...\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">\u8def\u7531\u524d\u7f00</p><p>\u63a7\u5236\u5668\u7c7b\u4e0a\u7684 <code>@Route</code> \u6807\u6ce8\u5b9a\u4e49\u6240\u6709\u64cd\u4f5c\u8def\u7531\u7684\u524d\u7f00\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n * @Route("/blog")\n */\nclass PostController extends Controller {\n    /**\n     * @Route("/{id}")\n     */\n    public function showAction($id) {\n    }\n}\n</code></pre>\n<p><code>show</code> \u64cd\u4f5c\u73b0\u5728\u6620\u5c04\u5230 <code>/blog/{id}</code> \u6a21\u5f0f\u3002</p>
SymfonyExtraAnnotationsProvider.name=Symfony 2/3 Extra
RouteTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Route</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p><code>@Route</code> \u6ce8\u89e3\u5c06\u8def\u7531\u6a21\u5f0f\u6620\u5c04\u5230\u63a7\u5236\u5668\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Route;\n\nclass PostController extends Controller {\n\    /**\n\     * @Route("/")\n\     */\n\    public function indexAction() {\n\        // ...\n\    }\n}\n</code></pre>\n<p><code>Post</code> \u63a7\u5236\u5668\u7684 <code>index</code> \u64cd\u4f5c\u73b0\u5728\u6620\u5c04\u5230 <code>/</code> URL\u3002\u8fd9\u7b49\u4ef7\u4e8e\u4ee5\u4e0b YAML \u914d\u7f6e\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nblog_home:\n\    pattern:  /\n\    defaults: { _controller: SensioBlogBundle:Post:index }\n</code></pre>\n<p>\u4e0e\u4efb\u4f55\u8def\u7531\u6a21\u5f0f\u4e00\u6837, \u53ef\u4ee5\u5b9a\u4e49\u5360\u4f4d\u7b26\u3001\u8981\u6c42\u548c\u9ed8\u8ba4\u503c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Route("/{id}", requirements={"id" = "\d+"}, defaults={"foo" = "bar"})\n\ */\npublic function showAction($id) {\n}\n</code></pre>\n<p>\u8fd8\u53ef\u4ee5\u901a\u8fc7\u5b9a\u4e49\u989d\u5916\u7684 <code>@Route</code> \u6ce8\u89e3\u6765\u5339\u914d\u591a\u4e2a URL\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Route("/", defaults={"id" = 1})\n\ * @Route("/{id}")\n\ */\npublic function showAction($id) {\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Activation</p><p>\u8def\u7531\u9700\u8981\u50cf\u4efb\u4f55\u5176\u4ed6\u8def\u7531\u8d44\u6e90\u4e00\u6837\u88ab\u5bfc\u5165\u624d\u80fd\u751f\u6548 (\u6ce8\u610f\u6ce8\u89e3\u7c7b\u578b)\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n# app/config/routing.yml\n\n# import routes from a controller class\npost:\n\    resource: "@SensioBlogBundle/Controller/PostController.php"\n\    type:     annotation\n</code></pre>\n<p>\u8fd8\u53ef\u4ee5\u5bfc\u5165\u6574\u4e2a\u76ee\u5f55\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n# import routes from a controller directory\nblog:\n\    resource: "@SensioBlogBundle/Controller"\n\    type:     annotation\n</code></pre>\n<p>\u4e0e\u4efb\u4f55\u5176\u4ed6\u8d44\u6e90\u4e00\u6837, \u53ef\u4ee5\u5c06\u8def\u7531 "\u6302\u8f7d" \u5230\u7ed9\u5b9a\u7684\u524d\u7f00\u4e0b\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\npost:\n\    resource: "@SensioBlogBundle/Controller/PostController.php"\n\    prefix:   /blog\n\    type:     annotation\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Route Name</p><p>\u4f7f\u7528 <code>@Route</code> \u6ce8\u89e3\u5b9a\u4e49\u7684\u8def\u7531\u4f1a\u88ab\u8d4b\u4e88\u4e00\u4e2a\u9ed8\u8ba4\u540d\u79f0, \u7531\u6346\u7ed1\u5305\u540d\u3001\u63a7\u5236\u5668\u540d\u548c\u64cd\u4f5c\u540d\u7ec4\u6210\u3002\u5bf9\u4e8e\u4e0a\u9762\u7684\u793a\u4f8b, \u8be5\u540d\u79f0\u4e3a <code>sensio_blog_post_index</code>\u3002</p><p><code>name</code> \u5c5e\u6027\u53ef\u7528\u4e8e\u8986\u76d6\u6b64\u9ed8\u8ba4\u8def\u7531\u540d\u79f0\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Route("/", name="blog_home")\n\ */\npublic function indexAction() {\n\    // ...\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Route Prefix</p><p>\u63a7\u5236\u5668\u7c7b\u4e0a\u7684 <code>@Route</code> \u6ce8\u89e3\u4e3a\u6240\u6709\u64cd\u4f5c\u8def\u7531\u5b9a\u4e49\u4e00\u4e2a\u524d\u7f00\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Route("/blog")\n\ */\nclass PostController extends Controller {\n\    /**\n\     * @Route("/{id}")\n\     */\n\    public function showAction($id) {\n\    }\n}\n</code></pre>\n<p><code>show</code> \u64cd\u4f5c\u73b0\u5728\u6620\u5c04\u5230 <code>/blog/{id}</code> \u6a21\u5f0f\u3002</p>
MethodTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Method</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p>\u6709\u4e00\u4e2a\u5feb\u6377\u7684 <code>@Method</code> \u6ce8\u89e3\u7528\u4e8e\u6307\u5b9a\u8def\u7531\u5141\u8bb8\u7684 HTTP \u65b9\u6cd5\u3002\u8981\u4f7f\u7528\u5b83, \u8bf7\u5bfc\u5165 <code>Method</code> \u6ce8\u89e3\u547d\u540d\u7a7a\u95f4\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Route;\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Method;\n\n/**\n * @Route("/blog")\n */\nclass PostController extends Controller {\n    /**\n     * @Route("/edit/{id}")\n     * @Method({"GET", "POST"})\n     */\n    public function editAction($id) {\n    }\n}\n</code></pre>\n<p>\u5982\u679c\u4f7f\u7528\u7684 HTTP \u65b9\u6cd5\u662f <code>GET</code> \u6216 <code>POST</code>, <code>edit</code> \u64cd\u4f5c\u73b0\u5728\u6620\u5c04\u5230 <code>/blog/edit/{id}</code> \u6a21\u5f0f\u3002</p><p>\u53ea\u6709\u5f53\u64cd\u4f5c\u5e26\u6709 <code>@Route</code> \u6ce8\u89e3\u65f6, <code>@Method</code> \u6ce8\u89e3\u624d\u4f1a\u88ab\u8003\u8651\u3002</p>
ParamConverterTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@ParamConverter</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p><code>@ParamConverter</code> \u6ce8\u89e3\u8c03\u7528<i>\u8f6c\u6362\u5668</i>\u5c06\u8bf7\u6c42\u53c2\u6570\u8f6c\u6362\u4e3a\u5bf9\u8c61\u3002\u8fd9\u4e9b\u5bf9\u8c61\u5b58\u50a8\u4e3a\u8bf7\u6c42\u5c5e\u6027, \u56e0\u6b64\u53ef\u4ee5\u4f5c\u4e3a\u63a7\u5236\u5668\u65b9\u6cd5\u53c2\u6570\u6ce8\u5165\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Route;\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\ParamConverter;\n\n/**\n\ * @Route("/blog/{id}")\n\ * @ParamConverter("post", class="SensioBlogBundle:Post")\n\ */\npublic function showAction(Post $post) {\n}\n</code></pre>\n<p>\u5e95\u5c42\u4f1a\u53d1\u751f\u4ee5\u4e0b\u51e0\u4ef6\u4e8b:</p><ul>  <li>The converter tries to get a <code>SensioBlogBundle:Post</code> object from the request attributes (request attributes comes from route placeholders -- here <code>id</code>);</li>  <li>If no <code>Post</code> object is found, a <code>404</code> <code>Response</code> is generated;</li>  <li>If a <code>Post</code> object is found, a new <code>post</code> request attribute is defined (accessible via <code>$request->attributes->get('post')</code>);</li>  <li>As for any other request attribute, it is automatically injected in the controller when present in the method signature.</li></ul><p>\u5982\u679c\u50cf\u4e0a\u9762\u7684\u793a\u4f8b\u90a3\u6837\u4f7f\u7528\u7c7b\u578b\u63d0\u793a, \u751a\u81f3\u53ef\u4ee5\u5b8c\u5168\u7701\u7565 <code>@ParamConverter</code> \u6ce8\u89e3\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n// automatic with method signature\npublic function showAction(Post $post) {\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Built-in Converters</p><p>\u8be5\u6346\u7ed1\u5305\u53ea\u6709\u4e00\u4e2a\u5185\u7f6e\u8f6c\u6362\u5668, \u5373 <code>Doctrine</code> \u8f6c\u6362\u5668\u3002</p><p><b><code>Doctrine</code> \u8f6c\u6362\u5668</b></p><p>\u9ed8\u8ba4\u60c5\u51b5\u4e0b, <code>Doctrine</code> \u8f6c\u6362\u5668\u4f7f\u7528\u9ed8\u8ba4\u7684\u5b9e\u4f53\u7ba1\u7406\u5668\u3002\u53ef\u4ee5\u901a\u8fc7 <code>entity_manager</code> \u9009\u9879\u8fdb\u884c\u914d\u7f6e\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Route;\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\ParamConverter;\n\n/**\n\ * @Route("/blog/{id}")\n\ * @ParamConverter("post", class="SensioBlogBundle:Post", options={"entity_manager" = "foo"})\n\ */\npublic function showAction(Post $post) {\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Creating a Converter</p><p>\u6240\u6709\u8f6c\u6362\u5668\u90fd\u5fc5\u987b\u5b9e\u73b0 <code>ParamConverterInterface</code>\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nnamespace Sensio\Bundle\FrameworkExtraBundle\Request\ParamConverter;\n\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\ConfigurationInterface;\nuse Symfony\Component\HttpFoundation\Request;\n\ninterface ParamConverterInterface {\n\    function apply(Request $request, ConfigurationInterface $configuration);\n\n\    function supports(ConfigurationInterface $configuration);\n}\n</code></pre>\n<p>\u5f53\u80fd\u591f\u8f6c\u6362\u7ed9\u5b9a\u7684\u914d\u7f6e (\u4e00\u4e2a <code>ParamConverter</code> \u5b9e\u4f8b) \u65f6, <code>supports()</code> \u65b9\u6cd5\u5fc5\u987b\u8fd4\u56de <code>true</code>\u3002</p><p><code>ParamConverter</code> \u5b9e\u4f8b\u5305\u542b\u6709\u5173\u6ce8\u89e3\u7684\u4e09\u9879\u4fe1\u606f:</p><table border="0"><tr>    <td valign="top"><b><code>name</code></b></td>    <td>The attribute name.</td></tr><tr>    <td valign="top"><b><code>class</code></b></td>    <td>The attribute class name (can be any string representing a class name).</td></tr><tr>    <td valign="top"><b><code>options</code></b></td>    <td>An array of options.</td></tr></table>\n<p>\u53ea\u8981\u652f\u6301\u67d0\u4e2a\u914d\u7f6e, \u5c31\u4f1a\u8c03\u7528 <code>apply()</code> \u65b9\u6cd5\u3002\u5b83\u5e94\u6839\u636e\u8bf7\u6c42\u5c5e\u6027\u8bbe\u7f6e\u4e00\u4e2a\u540d\u4e3a <code>$configuration->getName()</code> \u7684\u5c5e\u6027, \u5176\u4e2d\u5b58\u50a8 <code>$configuration->getClass()</code> \u7c7b\u7684\u5bf9\u8c61\u3002</p>
TemplateTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Template</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p><code>@Template</code> \u6ce8\u89e3\u5c06\u63a7\u5236\u5668\u4e0e\u6a21\u677f\u540d\u79f0\u5173\u8054\u8d77\u6765\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Template;\n\n/**\n\ * @Template("SensioBlogBundle:Post:show")\n\ */\npublic function showAction($id) {\n\    // get the Post\n\    $post = ...;\n\n\    return array('post' => $post);\n}\n</code></pre>\n<p>\u4f7f\u7528 <code>@Template</code> \u6ce8\u89e3\u65f6, \u63a7\u5236\u5668\u5e94\u8fd4\u56de\u4e00\u4e2a\u8981\u4f20\u9012\u7ed9\u89c6\u56fe\u7684\u53c2\u6570\u6570\u7ec4, \u800c\u4e0d\u662f <code>Response</code> \u5bf9\u8c61\u3002</p><p>\u5982\u679c\u6a21\u677f\u4ee5\u63a7\u5236\u5668\u540d\u548c\u64cd\u4f5c\u540d\u547d\u540d (\u4e0a\u9762\u7684\u793a\u4f8b\u5373\u662f\u5982\u6b64), \u751a\u81f3\u53ef\u4ee5\u7701\u7565\u6ce8\u89e3\u503c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Template\n\ */\npublic function showAction($id) {\n\    // get the Post\n\    $post = ...;\n\n\    return array('post' => $post);\n}\n</code></pre>\n<p>\u800c\u4e14, \u5982\u679c\u8981\u4f20\u9012\u7ed9\u6a21\u677f\u7684\u552f\u4e00\u53c2\u6570\u5c31\u662f\u65b9\u6cd5\u53c2\u6570, \u53ef\u4ee5\u4f7f\u7528 <code>vars</code> \u5c5e\u6027\u800c\u4e0d\u662f\u8fd4\u56de\u6570\u7ec4\u3002\u8fd9\u4e0e <code>@ParamConverter</code> \u6ce8\u89e3\u7ed3\u5408\u4f7f\u7528\u65f6\u975e\u5e38\u6709\u7528\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @ParamConverter("post", class="SensioBlogBundle:Post")\n\ * @Template("SensioBlogBundle:Post:show", vars={"post"})\n\ */\npublic function showAction(Post $post) {\n}\n</code></pre>\n<p>\u501f\u52a9\u7ea6\u5b9a, \u5b83\u7b49\u4ef7\u4e8e\u4ee5\u4e0b\u914d\u7f6e\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Template(vars={"post"})\n\ */\npublic function showAction(Post $post) {\n}\n</code></pre>\n<p>\u7531\u4e8e\u6240\u6709\u65b9\u6cd5\u53c2\u6570\u90fd\u4f1a\u81ea\u52a8\u4f20\u9012\u7ed9\u6a21\u677f, \u56e0\u6b64\u5982\u679c\u65b9\u6cd5\u8fd4\u56de <code>null</code> \u4e14\u672a\u5b9a\u4e49 <code>vars</code> \u5c5e\u6027, \u53ef\u4ee5\u8ba9\u4ee3\u7801\u66f4\u52a0\u7b80\u6d01\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Template\n\ */\npublic function showAction(Post $post) {\n}\n</code></pre>
CacheTag.documentation=<p style="font-weight: bold; font-size: 1.2em">@Cache</p><p style="font-weight: bold; font-size: 1.1em">Description</p><p><code>@Cache</code> \u6ce8\u89e3\u8ba9\u5b9a\u4e49 HTTP \u7f13\u5b58\u53d8\u5f97\u5bb9\u6613\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nuse Sensio\Bundle\FrameworkExtraBundle\Configuration\Cache;\n\n/**\n\ * @Cache(expires="tomorrow")\n\ */\npublic function indexAction() {\n}\n</code></pre>\n<p>\u8fd8\u53ef\u4ee5\u5728\u7c7b\u4e0a\u4f7f\u7528\u8be5\u6ce8\u89e3\u6765\u4e3a\u6240\u6709\u65b9\u6cd5\u5b9a\u4e49\u7f13\u5b58\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Cache(expires="tomorrow")\n\ */\nclass BlogController extends Controller {\n}\n</code></pre>\n<p>\u5f53\u7c7b\u914d\u7f6e\u548c\u65b9\u6cd5\u914d\u7f6e\u4e4b\u95f4\u5b58\u5728\u51b2\u7a81\u65f6, \u540e\u8005\u8986\u76d6\u524d\u8005\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n/**\n\ * @Cache(expires="tomorrow")\n\ */\nclass BlogController extends Controller {\n\    /**\n\     * @Cache(expires="+2 days")\n\     */\n\    public function indexAction() {\n\    }\n}\n</code></pre>\n<p style="font-weight: bold; font-size: 1.1em">Attributes</p><p>\u4e0b\u9762\u662f\u63a5\u53d7\u7684\u5c5e\u6027\u53ca\u5176\u5bf9\u5e94\u7684 HTTP \u5934\u7684\u5217\u8868:</p><table border="0"><tr>    <td><code>@Cache(expires="tomorrow")</code></td>    <td><code>$response->setExpires()</code></td></tr><tr>    <td><code>@Cache(smaxage="15")</code></td>    <td><code>$response->setSharedMaxAge()</code></td></tr><tr>    <td><code>@Cache(maxage="15")</code></td>    <td><code>$response->setMaxAge()</code></td></tr></table>
