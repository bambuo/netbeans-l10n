TAG_verbatim=<p style="font-weight: bold; font-size: 1.2em">verbatim</p><p><code>verbatim</code> \u6807\u8bb0\u7528\u4e8e\u5c06\u5404\u90e8\u5206\u6807\u8bb0\u4e3a\u4e0d\u5e94\u89e3\u6790\u7684 verbatim \u6587\u672c\u3002\u4f8b\u5982, \u8981\u5c06 Twig \u8bed\u6cd5\u4f5c\u4e3a\u793a\u4f8b\u653e\u5165\u6a21\u677f\u4e2d, \u60a8\u53ef\u4ee5\u4f7f\u7528\u4ee5\u4e0b\u7247\u6bb5:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% verbatim %}\n    &lt;ul>\n    {% for item in seq %}\n        &lt;li>{{ item }}&lt;/li>\n    {% endfor %}\n    &lt;/ul>\n{% endverbatim %}\n</code></pre>
TAG_autoescape=<p style="font-weight: bold; font-size: 1.2em">autoescape</p><p>\u65e0\u8bba\u662f\u5426\u542f\u7528\u81ea\u52a8\u8f6c\u4e49, \u90fd\u53ef\u4ee5\u4f7f\u7528 <code>autoescape</code> \u6807\u7b7e\u5c06\u6a21\u677f\u7684\u67d0\u4e2a\u90e8\u5206\u6807\u8bb0\u4e3a\u8f6c\u4e49\u6216\u4e0d\u8f6c\u4e49:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{# The following syntax works as of Twig 1.8 -- see the note below for previous versions #}\n\n{% autoescape %}\n\    Everything will be automatically escaped in this block\n\    using the HTML strategy\n{% endautoescape %}\n\n{% autoescape 'html' %}\n\    Everything will be automatically escaped in this block\n\    using the HTML strategy\n{% endautoescape %}\n\n{% autoescape 'js' %}\n\    Everything will be automatically escaped in this block\n\    using the js escaping strategy\n{% endautoescape %}\n\n{% autoescape false %}\n\    Everything will be outputted as is in this block\n{% endautoescape %}\n</code></pre>
TAG_block=<p style="font-weight: bold; font-size: 1.2em">block</p><p>\u5757 (block) \u7528\u4e8e\u7ee7\u627f, \u540c\u65f6\u5145\u5f53\u5360\u4f4d\u7b26\u548c\u66ff\u6362\u5185\u5bb9\u3002\u8be6\u89c1 <code>extends</code> \u6807\u7b7e\u7684\u6587\u6863\u3002</p><p>\u5757\u540d\u53ea\u80fd\u7531\u5b57\u6bcd\u6570\u5b57\u5b57\u7b26\u548c\u4e0b\u5212\u7ebf\u7ec4\u6210\u3002\u4e0d\u5141\u8bb8\u4f7f\u7528\u8fde\u5b57\u7b26\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% block head %}\n\    &lt;link rel="stylesheet" href="style.css" /&gt;\n\    &lt;title&gt;{% block title %}{% endblock %} - My Webpage&lt;/title&gt;\n{% endblock %}\n</code></pre>
TAG_do=<p style="font-weight: bold; font-size: 1.2em">do</p><p><code>do</code> \u6807\u7b7e\u7684\u5de5\u4f5c\u65b9\u5f0f\u4e0e\u666e\u901a\u53d8\u91cf\u8868\u8fbe\u5f0f (<code>{{ ... }}</code>) \u5b8c\u5168\u76f8\u540c, \u53ea\u662f\u4e0d\u8f93\u51fa\u4efb\u4f55\u5185\u5bb9:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% do 1 + 2 %}\n</code></pre>
TAG_embed=<p style="font-weight: bold; font-size: 1.2em">embed</p><p><code>embed</code> \u6807\u7b7e\u7ed3\u5408\u4e86 <code>include</code> \u548c <code>extends</code> \u7684\u884c\u4e3a\u3002\u5b83\u5141\u8bb8\u50cf <code>include</code> \u90a3\u6837\u5305\u542b\u53e6\u4e00\u4e2a\u6a21\u677f\u7684\u5185\u5bb9, \u540c\u65f6\u8fd8\u5141\u8bb8\u8986\u76d6\u88ab\u5305\u542b\u6a21\u677f\u4e2d\u5b9a\u4e49\u7684\u4efb\u4f55\u5757, \u5c31\u50cf\u6269\u5c55\u6a21\u677f\u65f6\u4e00\u6837\u3002</p><p>\u53ef\u4ee5\u628a\u5d4c\u5165\u6a21\u677f\u770b\u4f5c\u4e00\u4e2a "\u5fae\u5e03\u5c40\u9aa8\u67b6"\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% embed "teasers_skeleton.twig" %}\n\    {# These blocks are defined in "teasers_skeleton.twig" #}\n\    {# and we override them right here:                    #}\n\    {% block left_teaser %}\n\        Some content for the left teaser box\n\    {% endblock %}\n\    {% block right_teaser %}\n\        Some content for the right teaser box\n\    {% endblock %}\n{% endembed %}\n</code></pre>
TAG_extends=<p style="font-weight: bold; font-size: 1.2em">extends</p><p>extends \u6807\u7b7e\u53ef\u7528\u4e8e\u4ece\u53e6\u4e00\u4e2a\u6a21\u677f\u6269\u5c55\u6a21\u677f\u3002</p><p>\u4e0e PHP \u4e00\u6837, Twig \u4e0d\u652f\u6301\u591a\u91cd\u7ee7\u627f\u3002\u56e0\u6b64\u6bcf\u6b21\u6e32\u67d3\u53ea\u80fd\u8c03\u7528\u4e00\u4e2a extends \u6807\u7b7e\u3002\u4e0d\u8fc7, Twig \u652f\u6301\u6a2a\u5411\u590d\u7528\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6211\u4eec\u6765\u5b9a\u4e49\u4e00\u4e2a\u57fa\u7840\u6a21\u677f base.html, \u5b83\u5b9a\u4e49\u4e86\u4e00\u4e2a\u7b80\u5355\u7684 HTML \u9aa8\u67b6\u6587\u6863:</p><pre><code>\n&lt;!DOCTYPE html>\n&lt;html>\n\    &lt;head>\n\        {% block head %}\n\            &lt;link rel="stylesheet" href="style.css" />\n\            &lt;title>{% block title %}{% endblock %} - My Webpage<&lt;/title>\n\        {% endblock %}\n\    &lt;/head>\n\    &lt;body>\n\        &lt;div id="content">{% block content %}{% endblock %}&lt;/div>\n\        &lt;div id="footer">\n\            {% block footer %}\n\                &copy; Copyright 2011 by &lt;a href="http://domain.invalid/">you&lt;/a>.\n\            {% endblock %}\n\        &lt;/div>\n\    &lt;/body>\n&lt;/html>\n</code></pre><p>\u5b50\u6a21\u677f\u53ef\u80fd\u5982\u4e0b\u6240\u793a:</p><pre><code>\n{% extends "base.html" %}\n\n{% block title %}Index{% endblock %}\n{% block head %}\n\    {{ parent() }}\n\    &lt;style type="text/css">\n\        .important { color: #336699; }\n\    &lt;/style>\n{% endblock %}\n{% block content %}\n\    &lt;h1>Index&lt;/h1>\n\    &lt;p class="important">\n\        Welcome on my awesome homepage.\n\    &lt;/p>\n{% endblock %}\n</code></pre>
TAG_filter=<p style="font-weight: bold; font-size: 1.2em">filter</p><p>\u8fc7\u6ee4\u5668 (filter) \u6bb5\u5141\u8bb8\u4f60\u5bf9\u6a21\u677f\u6570\u636e\u5757\u5e94\u7528\u5e38\u89c4 Twig \u8fc7\u6ee4\u5668\u3002\u53ea\u9700\u5c06\u4ee3\u7801\u5305\u88f9\u5728\u7279\u6b8a\u7684 <code>filter</code> \u6bb5\u4e2d:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% filter lower|escape %}\n\    &lt;strong>SOME TEXT&lt;/strong>\n{% endfilter %}\n\n{# outputs "&amp;lt;strong&amp;gt;some text&amp;lt;/strong\&amp;gt;" #}\n</code></pre>
TAG_flush=<p style="font-weight: bold; font-size: 1.2em">flush</p><p><code>flush</code> \u6807\u7b7e\u8ba9 Twig \u5237\u65b0\u8f93\u51fa\u7f13\u51b2\u533a:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% flush %}\n</code></pre>
TAG_for=<p style="font-weight: bold; font-size: 1.2em">for</p><p>\u904d\u5386\u5e8f\u5217\u4e2d\u7684\u6bcf\u4e00\u9879\u3002\u4f8b\u5982, \u8981\u663e\u793a\u53d8\u91cf <code>users</code> \u4e2d\u63d0\u4f9b\u7684\u7528\u6237\u5217\u8868:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n&lt;h1>Members&lt;/h1>\n&lt;ul>\n\    {% for user in users %}\n\        &lt;li>{{ user.username|e }}&lt;/li>\n\    {% endfor %}\n&lt;/ul>\n</code></pre>
TAG_from=<p style="font-weight: bold; font-size: 1.2em">from</p><p><code>from</code> \u6807\u7b7e\u5c06 <code>macro</code> \u540d\u79f0\u5bfc\u5165\u5f53\u524d\u547d\u540d\u7a7a\u95f4\u3002\u8be5\u6807\u7b7e\u5728 <code>import</code> \u6807\u7b7e\u7684\u6587\u6863\u4e2d\u6709\u8be6\u7ec6\u8bf4\u660e\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% from 'forms.html' import input as input_field, textarea %}</code></pre>
TAG_if=<p style="font-weight: bold; font-size: 1.2em">if</p><p>Twig \u4e2d\u7684 <code>if</code> \u8bed\u53e5\u4e0e PHP \u7684 if \u8bed\u53e5\u7c7b\u4f3c\u3002\u6700\u7b80\u5355\u7684\u5f62\u5f0f\u662f\u6d4b\u8bd5\u8868\u8fbe\u5f0f\u662f\u5426\u6c42\u503c\u4e3a <code>true</code>:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% if online == false %}\n\    &lt;p>Our website is in maintenance mode. Please, come back later.&lt;/p>\n{% endif %}\n</code></pre>
TAG_import=<p style="font-weight: bold; font-size: 1.2em">import</p><p>Twig \u652f\u6301\u5c06\u5e38\u7528\u4ee3\u7801\u653e\u5165\u5b8f (macro)\u3002\u8fd9\u4e9b\u5b8f\u53ef\u4ee5\u653e\u5728\u4e0d\u540c\u7684\u6a21\u677f\u4e2d\u5e76\u4ece\u90a3\u91cc\u5bfc\u5165\u3002</p><p>\u5bfc\u5165\u6a21\u677f\u6709\u4e24\u79cd\u65b9\u5f0f\u3002\u53ef\u4ee5\u5c06\u5b8c\u6574\u6a21\u677f\u5bfc\u5165\u4e00\u4e2a\u53d8\u91cf, \u4e5f\u53ef\u4ee5\u4ece\u4e2d\u8bf7\u6c42\u7279\u5b9a\u7684\u5b8f\u3002</p><p>\u5047\u8bbe\u6211\u4eec\u6709\u4e00\u4e2a\u6e32\u67d3\u8868\u5355\u7684\u8f85\u52a9\u6a21\u5757 (\u540d\u4e3a forms.html):</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% macro input(name, value, type, size) %}\n\    &lt;input type="{{ type|default('text') }}" name="{{ name }}" value="{{ value|e }}" size="{{ size|default(20) }}" />\n{% endmacro %}\n\n{% macro textarea(name, value, rows) %}\n\    &lt;textarea name="{{ name }}" rows="{{ rows|default(10) }}" cols="{{ cols|default(40) }}">{{ value|e }}&lt;/textarea>\n{% endmacro %}\n</code></pre><p>\u6700\u7b80\u5355\u3001\u6700\u7075\u6d3b\u7684\u65b9\u5f0f\u662f\u5c06\u6574\u4e2a\u6a21\u5757\u5bfc\u5165\u4e00\u4e2a\u53d8\u91cf\u3002\u8fd9\u6837\u5c31\u53ef\u4ee5\u8bbf\u95ee\u5176\u5c5e\u6027:</p><pre><code>\n{% import 'forms.html' as forms %}\n\n&lt;dl>\n\    &lt;dt>Username&lt;/dt>\n\    &lt;dd>{{ forms.input('username') }}&lt;/dd>\n\    &lt;dt>Password&lt;/dt>\n\    &lt;dd>{{ forms.input('password', null, 'password') }}&lt;/dd>\n&lt;/dl>\n&lt;p>{{ forms.textarea('comment') }}&lt;/p>\n</code></pre><p>\u6216\u8005, \u53ef\u4ee5\u5c06\u540d\u79f0\u4ece\u6a21\u677f\u5bfc\u5165\u5f53\u524d\u547d\u540d\u7a7a\u95f4:</p><pre><code>\n{% from 'forms.html' import input as input_field, textarea %}\n\n&lt;dl>\n\    &lt;dt>Username&lt;/dt>\n\    &lt;dd>{{ input_field('username') }}&lt;/dd>\n\    &lt;dt>Password&lt;/dt>\n\    &lt;dd>{{ input_field('password', '', 'password') }}&lt;/dd>\n&lt;/dl>\n&lt;p>{{ textarea('comment') }}&lt;/p>\n</code></pre>
TAG_include=<p style="font-weight: bold; font-size: 1.2em">include</p><p><code>include</code> \u8bed\u53e5\u5305\u542b\u4e00\u4e2a\u6a21\u677f, \u5e76\u5c06\u8be5\u6587\u4ef6\u6e32\u67d3\u540e\u7684\u5185\u5bb9\u8fd4\u56de\u5230\u5f53\u524d\u547d\u540d\u7a7a\u95f4:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% include 'header.html' %}\n\    Body\n{% include 'footer.html' %}\n</code></pre><p>\u88ab\u5305\u542b\u7684\u6a21\u677f\u53ef\u4ee5\u8bbf\u95ee\u5f53\u524d\u4e0a\u4e0b\u6587\u7684\u53d8\u91cf\u3002</p><p>\u5982\u679c\u4f7f\u7528\u6587\u4ef6\u7cfb\u7edf\u52a0\u8f7d\u5668, \u5c06\u5728\u5b83\u5b9a\u4e49\u7684\u8def\u5f84\u4e2d\u67e5\u627e\u6a21\u677f\u3002</p><p>\u53ef\u4ee5\u901a\u8fc7\u5728 <code>with</code> \u5173\u952e\u5b57\u540e\u4f20\u9012\u53c2\u6570\u6765\u6dfb\u52a0\u989d\u5916\u7684\u53d8\u91cf:</p><pre><code>\n{# the foo template will have access to the variables from the current context and the foo one #}\n{% include 'foo' with {'foo': 'bar'} %}\n\n{% set vars = {'foo': 'bar'} %}\n{% include 'foo' with vars %}\n</code></pre><p>\u53ef\u4ee5\u901a\u8fc7\u8ffd\u52a0 <code>only</code> \u5173\u952e\u5b57\u6765\u7981\u6b62\u8bbf\u95ee\u4e0a\u4e0b\u6587:</p><pre><code>\n{# only the foo variable will be accessible #}\n{% include 'foo' with {'foo': 'bar'} only %}\n\n{# no variable will be accessible #}\n{% include 'foo' only %}\n</code></pre>
TAG_macro=<p style="font-weight: bold; font-size: 1.2em">macro</p><p>\u5b8f\u4e0e\u5e38\u89c4\u7f16\u7a0b\u8bed\u8a00\u4e2d\u7684\u51fd\u6570\u7c7b\u4f3c\u3002\u5b83\u4eec\u975e\u5e38\u9002\u5408\u5c06\u5e38\u7528\u7684 HTML \u60ef\u7528\u6cd5\u653e\u5165\u53ef\u590d\u7528\u7684\u5143\u7d20\u4e2d, \u907f\u514d\u91cd\u590d\u81ea\u5df1\u3002</p><p>\u4e0b\u9762\u662f\u4e00\u4e2a\u6e32\u67d3\u8868\u5355\u5143\u7d20\u7684\u5b8f\u7684\u5c0f\u793a\u4f8b:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% macro input(name, value, type, size) %}\n\    &lt;input type="{{ type|default('text') }}" name="{{ name }}" value="{{ value|e }}" size="{{ size|default(20) }}" />\n{% endmacro %}\n</code></pre><p>\u5b8f\u4e0e\u539f\u751f PHP \u51fd\u6570\u6709\u51e0\u5904\u4e0d\u540c:</p><ul><li>Default argument values are defined by using the <code>default</code> filter in the macro body;</li><li>Arguments of a macro are always optional.</li></ul><p>\u4f46\u4e0e PHP \u51fd\u6570\u4e00\u6837, \u5b8f\u65e0\u6cd5\u8bbf\u95ee\u5f53\u524d\u6a21\u677f\u7684\u53d8\u91cf\u3002</p>
TAG_raw=<p style="font-weight: bold; font-size: 1.2em">raw</p><p><code>raw</code> \u6807\u7b7e\u5c06\u67d0\u4e9b\u90e8\u5206\u6807\u8bb0\u4e3a\u4e0d\u5e94\u89e3\u6790\u7684\u539f\u59cb\u6587\u672c\u3002\u4f8b\u5982, \u8981\u5c06 Twig \u8bed\u6cd5\u4f5c\u4e3a\u793a\u4f8b\u653e\u5165\u6a21\u677f, \u53ef\u4ee5\u4f7f\u7528\u4ee5\u4e0b\u4ee3\u7801\u7247\u6bb5:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% raw %}\n\    &lt;ul>\n\    {% for item in seq %}\n\        &lt;li>{{ item }}&lt;/li>\n\    {% endfor %}\n\    &lt;/ul>\n{% endraw %}\n</code></pre>
TagRhs=\u6807\u8bb0
TestRhs=\u6d4b\u8bd5
TAG_sandbox=<p style="font-weight: bold; font-size: 1.2em">sandbox</p><p>\u5f53\u672a\u5bf9 Twig \u73af\u5883\u5168\u5c40\u542f\u7528\u6c99\u7bb1\u6a21\u5f0f\u65f6, <code>sandbox</code> \u6807\u7b7e\u53ef\u7528\u4e8e\u4e3a\u88ab\u5305\u542b\u7684\u6a21\u677f\u542f\u7528\u6c99\u7bb1\u6a21\u5f0f:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% sandbox %}\n\    {% include 'user.html' %}\n{% endsandbox %}\n</code></pre><p><code>sandbox</code> \u6807\u7b7e\u4ec5\u5728\u542f\u7528\u6c99\u7bb1\u6269\u5c55\u65f6\u53ef\u7528 (\u53c2\u89c1 <a href="http://twig.sensiolabs.org/doc/api.html">Twig for Developers</a> \u4e00\u7ae0)\u3002</p><p><code>sandbox</code> \u6807\u7b7e\u53ea\u80fd\u7528\u4e8e\u6c99\u7bb1\u5316 include \u6807\u7b7e, \u4e0d\u80fd\u7528\u4e8e\u6c99\u7bb1\u5316\u6a21\u677f\u7684\u67d0\u4e2a\u90e8\u5206\u3002\u4f8b\u5982, \u4e0b\u9762\u7684\u793a\u4f8b\u5c06\u65e0\u6cd5\u5de5\u4f5c:</p><pre><code>\n{% sandbox %}\n\    {% for i in 1..2 %}\n\        {{ i }}\n\    {% endfor %}\n{% endsandbox %}\n</code></pre>
TAG_set=<p style="font-weight: bold; font-size: 1.2em">set</p><p>\u5728\u4ee3\u7801\u5757\u4e2d, \u8fd8\u53ef\u4ee5\u4e3a\u53d8\u91cf\u8d4b\u503c\u3002\u8d4b\u503c\u4f7f\u7528 <code>set</code> \u6807\u7b7e, \u5e76\u4e14\u53ef\u4ee5\u6709\u591a\u4e2a\u76ee\u6807:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% set foo = 'foo' %}\n\n{% set foo = [1, 2] %}\n\n{% set foo = {'foo': 'bar'} %}\n\n{% set foo = 'foo' ~ 'bar' %}\n\n{% set foo, bar = 'foo', 'bar' %}\n</code></pre><p><code>set</code> \u6807\u7b7e\u8fd8\u53ef\u7528\u4e8e "\u6355\u83b7" \u6587\u672c\u5757:</p><pre><code>\n{% set foo %}\n  &lt;div id="pagination">\n    ...\n  &lt;/div>\n{% endset %}\n</code></pre><p>\u5982\u679c\u542f\u7528\u4e86\u81ea\u52a8\u8f93\u51fa\u8f6c\u4e49, Twig \u53ea\u6709\u5728\u6355\u83b7\u6587\u672c\u5757\u65f6\u624d\u4f1a\u8ba4\u4e3a\u5185\u5bb9\u662f\u5b89\u5168\u7684\u3002</p>
TAG_spaceless=<p style="font-weight: bold; font-size: 1.2em">spaceless</p><p>\u4f7f\u7528 <code>spaceless</code> \u6807\u7b7e\u53ef\u79fb\u9664 HTML \u6807\u7b7e\u4e4b\u95f4\u7684\u7a7a\u767d, \u4f46\u4e0d\u79fb\u9664 HTML \u6807\u7b7e\u5185\u6216\u7eaf\u6587\u672c\u4e2d\u7684\u7a7a\u767d:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% spaceless %}\n\    &lt;div>\n\        &lt;strong>foo&lt;/strong>\n\    &lt;/div>\n{% endspaceless %}\n\n{# output will be &lt;div>&lt;strong>foo&lt;/strong>&lt;/div> #}\n</code></pre><p>\u6b64\u6807\u7b7e\u5e76\u975e\u7528\u4e8e "\u4f18\u5316" \u751f\u6210\u7684 HTML \u5185\u5bb9\u7684\u5927\u5c0f, \u800c\u53ea\u662f\u907f\u514d HTML \u6807\u7b7e\u4e4b\u95f4\u51fa\u73b0\u591a\u4f59\u7a7a\u767d, \u4ee5\u89c4\u907f\u67d0\u4e9b\u60c5\u51b5\u4e0b\u6d4f\u89c8\u5668\u6e32\u67d3\u7684\u602a\u5f02\u884c\u4e3a\u3002</p>
TAG_use=<p style="font-weight: bold; font-size: 1.2em">use</p><p>\u6a2a\u5411\u590d\u7528\u662f\u4e00\u9879\u9ad8\u7ea7 Twig \u7279\u6027, \u5e38\u89c4\u6a21\u677f\u4e2d\u51e0\u4e4e\u7528\u4e0d\u5230\u3002\u5b83\u4e3b\u8981\u4f9b\u9700\u8981\u5728\u4e0d\u4f7f\u7528\u7ee7\u627f\u7684\u60c5\u51b5\u4e0b\u590d\u7528\u6a21\u677f\u5757\u7684\u9879\u76ee\u4f7f\u7528\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6a21\u677f\u7ee7\u627f\u662f Twig \u6700\u5f3a\u5927\u7684\u7279\u6027\u4e4b\u4e00, \u4f46\u5b83\u4ec5\u9650\u4e8e\u5355\u7ee7\u627f; \u4e00\u4e2a\u6a21\u677f\u53ea\u80fd\u6269\u5c55\u53e6\u4e00\u4e2a\u6a21\u677f\u3002\u8fd9\u4e00\u9650\u5236\u4f7f\u6a21\u677f\u7ee7\u627f\u6613\u4e8e\u7406\u89e3\u548c\u8c03\u8bd5:</p><pre><code>\n{% extends "base.html" %}\n\n{% block title %}{% endblock %}\n{% block content %}{% endblock %}\n</code></pre><p>\u6a2a\u5411\u590d\u7528\u53ef\u4ee5\u5728\u6ca1\u6709\u591a\u91cd\u7ee7\u627f\u76f8\u5173\u590d\u6742\u6027\u7684\u60c5\u51b5\u4e0b\u5b9e\u73b0\u540c\u6837\u7684\u76ee\u6807:</p><pre><code>\n{% extends "base.html" %}\n\n{% use "blocks.html" %}\n\n{% block title %}{% endblock %}\n{% block content %}{% endblock %}\n</code></pre><p><code>use</code> \u8bed\u53e5\u544a\u8bc9 Twig \u5c06 `blocks.html \u4e2d\u5b9a\u4e49\u7684\u5757\u5bfc\u5165\u5f53\u524d\u6a21\u677f (\u7c7b\u4f3c\u4e8e\u5b8f, \u4f46\u9488\u5bf9\u5757):</p><pre><code>\n\# blocks.html\n{% block sidebar %}{% endblock %}\n</code></pre><p>\u5728\u6b64\u793a\u4f8b\u4e2d, <code>use</code> \u8bed\u53e5\u5c06 <code>sidebar</code> \u5757\u5bfc\u5165\u4e3b\u6a21\u677f\u3002\u5176\u4ee3\u7801\u5728\u5927\u591a\u6570\u60c5\u51b5\u4e0b\u7b49\u4ef7\u4e8e\u4e0b\u9762\u7684\u5199\u6cd5 (\u88ab\u5bfc\u5165\u7684\u5757\u4e0d\u4f1a\u81ea\u52a8\u8f93\u51fa):</p><pre><code>\n{% extends "base.html" %}\n\n{% block sidebar %}{% endblock %}\n{% block title %}{% endblock %}\n{% block content %}{% endblock %}\n</code></pre>
TAG_trans=<p style="font-weight: bold; font-size: 1.2em">trans</p><p><code>i18n</code> \u6269\u5c55\u4e3a Twig \u6dfb\u52a0\u4e86 gettext \u652f\u6301\u3002\u4f60\u9700\u8981\u5728\u4f7f\u7528 trans \u5757\u4e4b\u524d\u6ce8\u518c\u6b64\u6269\u5c55:</p><p style="font-weight: bold; font-size: 1.1em">Registration</p><pre><code>\n$twig->addExtension(new Twig_Extensions_Extension_I18n());\n</code></pre><p>\u6ce8\u610f, \u5728\u6e32\u67d3\u4efb\u4f55\u56fd\u9645\u5316\u6a21\u677f\u4e4b\u524d, \u5fc5\u987b\u5148\u914d\u7f6e <code>gettext</code> \u6269\u5c55\u3002\u4e0b\u9762\u662f\u6765\u81ea <a href="http://php.net/manual/en/function.gettext.php">PHP \u6587\u6863</a>\u7684\u7b80\u5355\u914d\u7f6e\u793a\u4f8b:</p><p style="font-weight: bold; font-size: 1.1em">Configuration</p><pre><code>\n// Set language to French\nputenv('LC_ALL=fr_FR');\nsetlocale(LC_ALL, 'fr_FR');\n\n// Specify the location of the translation tables\nbindtextdomain('myAppPhp', 'includes/locale');\nbind_textdomain_codeset('myAppPhp', 'UTF-8');\n\n// Choose domain\ntextdomain('myAppPhp');\n$twig->addExtension(new Twig_Extensions_Extension_I18n());\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Usage</p><pre><code>\n{% trans "Hello World!" %}\n\n{% trans string_var %}\n\n{% trans %}\n\    Hello World!\n{% endtrans %}\n</code></pre>
TEST_constant=<p style="font-weight: bold; font-size: 1.2em">constant</p><p><code>constant</code> \u68c0\u67e5\u53d8\u91cf\u662f\u5426\u4e0e\u67d0\u4e2a\u5e38\u91cf\u5177\u6709\u5b8c\u5168\u76f8\u540c\u7684\u503c\u3002\u53ef\u4ee5\u4f7f\u7528\u5168\u5c40\u5e38\u91cf\u6216\u7c7b\u5e38\u91cf:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% if post.status is constant('Post::PUBLISHED') %}\n\    the status attribute is exactly the same as Post::PUBLISHED\n{% endif %}\n</code></pre>
TEST_defined=<p style="font-weight: bold; font-size: 1.2em">defined</p><p><code>defined</code> \u68c0\u67e5\u53d8\u91cf\u662f\u5426\u5728\u5f53\u524d\u4e0a\u4e0b\u6587\u4e2d\u5b9a\u4e49\u3002\u5982\u679c\u4f7f\u7528 <code>strict_variables</code> \u9009\u9879, \u8fd9\u4f1a\u975e\u5e38\u6709\u7528:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{# defined works with variable names #}\n{% if foo is defined %}\n\    ...\n{% endif %}\n\n{# and attributes on variables names #}\n{% if foo.bar is defined %}\n\    ...\n{% endif %}\n\n{% if foo['bar'] is defined %}\n\    ...\n{% endif %}\n</code></pre><p>\u5bf9\u5728\u67d0\u4e9b\u65b9\u6cd5\u8c03\u7528\u4e2d\u4f7f\u7528\u53d8\u91cf\u7684\u8868\u8fbe\u5f0f\u4f7f\u7528 <code>defined</code> \u6d4b\u8bd5\u65f6, \u8bf7\u786e\u4fdd\u5b83\u4eec\u90fd\u5df2\u88ab\u5b9a\u4e49:</p><pre><code>\n{% if var is defined and foo.method(var) is defined %}\n\    ...\n{% endif %}\n</code></pre>
TEST_divisibleby=<p style="font-weight: bold; font-size: 1.2em">divisibleby</p><p><code>divisibleby</code> \u68c0\u67e5\u53d8\u91cf\u662f\u5426\u53ef\u4ee5\u88ab\u67d0\u4e2a\u6570\u6574\u9664:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% if loop.index is divisibleby(3) %}\n\    ...\n{% endif %}\n</code></pre>
TEST_empty=<p style="font-weight: bold; font-size: 1.2em">empty</p><p><code>empty</code> \u68c0\u67e5\u53d8\u91cf\u662f\u5426\u4e3a\u7a7a:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{# evaluates to true if the foo variable is null, false, an empty array, or the empty string #}\n{% if foo is empty %}\n\    ...\n{% endif %}\n</code></pre>
TEST_even=<p style="font-weight: bold; font-size: 1.2em">even</p><p>\u5982\u679c\u7ed9\u5b9a\u7684\u6570\u662f\u5076\u6570, <code>even</code> \u8fd4\u56de <code>true</code>:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ var is even }}</code></pre>
TEST_iterable=<p style="font-weight: bold; font-size: 1.2em">iterable</p><p><code>iterable</code> \u68c0\u67e5\u53d8\u91cf\u662f\u5426\u4e3a\u6570\u7ec4\u6216\u53ef\u904d\u5386\u5bf9\u8c61:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{# evaluates to true if the foo variable is iterable #}\n{% if users is iterable %}\n\    {% for user in users %}\n\        Hello {{ user }}!\n\    {% endfor %}\n{% else %}\n\    {# users is probably a string #}\n\    Hello {{ users }}!\n{% endif %}\n</code></pre>
TEST_null=<p style="font-weight: bold; font-size: 1.2em">null</p><p>\u5982\u679c\u53d8\u91cf\u4e3a <code>null</code>, <code>null</code> \u8fd4\u56de <code>true</code>:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ var is null }}</code></pre><p><code>none</code> \u662f <code>null</code> \u7684\u522b\u540d\u3002</p>
TEST_odd=<p style="font-weight: bold; font-size: 1.2em">odd</p><p>\u5982\u679c\u7ed9\u5b9a\u7684\u6570\u662f\u5947\u6570, <code>odd</code> \u8fd4\u56de <code>true</code>:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ var is odd }}</code></pre>
TEST_sameas=<p style="font-weight: bold; font-size: 1.2em">sameas</p><p><code>sameas</code> \u68c0\u67e5\u53d8\u91cf\u662f\u5426\u6307\u5411\u4e0e\u53e6\u4e00\u4e2a\u53d8\u91cf\u76f8\u540c\u7684\u5185\u5b58\u5730\u5740:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% if foo.attribute is sameas(false) %}\n\    the foo attribute really is the ``false`` PHP value\n{% endif %}\n</code></pre>
FUNCTION_attribute=<p style="font-weight: bold; font-size: 1.2em">attribute</p><p><code>attribute</code> \u53ef\u7528\u4e8e\u8bbf\u95ee\u53d8\u91cf\u7684 "\u52a8\u6001" \u5c5e\u6027:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ attribute(object, method) }}\n{{ attribute(object, method, arguments) }}\n{{ attribute(array, item) }}\n</code></pre><p>\u5176\u89e3\u6790\u7b97\u6cd5\u4e0e . \u8868\u793a\u6cd5\u4f7f\u7528\u7684\u7b97\u6cd5\u76f8\u540c, \u53ea\u662f\u5176\u4e2d\u7684\u9879\u53ef\u4ee5\u662f\u4efb\u4f55\u6709\u6548\u7684\u8868\u8fbe\u5f0f\u3002</p>
FUNCTION_block=<p style="font-weight: bold; font-size: 1.2em">block</p><p>\u5f53\u6a21\u677f\u4f7f\u7528\u7ee7\u627f\u4e14\u4f60\u5e0c\u671b\u591a\u6b21\u6253\u5370\u67d0\u4e2a\u5757\u65f6, \u53ef\u4ee5\u4f7f\u7528 <code>block</code> \u51fd\u6570:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n&lt;title>{% block title %}{% endblock %}&lt;/title>\n\n&lt;h1>{{ block('title') }}&lt;/h1>\n\n{% block body %}{% endblock %}\n</code></pre>
FUNCTION_constant=<p style="font-weight: bold; font-size: 1.2em">constant</p><p><code>constant</code> \u8fd4\u56de\u7ed9\u5b9a\u5b57\u7b26\u4e32\u5bf9\u5e94\u7684\u5e38\u91cf\u503c:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ some_date|date(constant('DATE_W3C')) }}\n{{ constant('Namespace\\Classname::CONSTANT_NAME') }}\n</code></pre>
FUNCTION_cycle=<p style="font-weight: bold; font-size: 1.2em">cycle</p><p><code>cycle</code> \u51fd\u6570\u5728\u503c\u6570\u7ec4\u4e0a\u5faa\u73af:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% for i in 0..10 %}\n\    {{ cycle(['odd', 'even'], i) }}\n{% endfor %}\n</code></pre><p>\u6570\u7ec4\u53ef\u4ee5\u5305\u542b\u4efb\u610f\u6570\u91cf\u7684\u503c:</p><pre><code>\n{% set fruits = ['apple', 'orange', 'citrus'] %}\n\n{% for i in 0..10 %}\n\    {{ cycle(fruits, i) }}\n{% endfor %}\n</code></pre>
FUNCTION_date=<p style="font-weight: bold; font-size: 1.2em">date</p><p>\u5c06\u53c2\u6570\u8f6c\u6362\u4e3a\u65e5\u671f\u4ee5\u4fbf\u8fdb\u884c\u65e5\u671f\u6bd4\u8f83:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% if date(user.created_at) &lt; date('+2days') %}\n\    {# do something #}\n{% endif %}\n</code></pre><p>\u53c2\u6570\u5fc5\u987b\u662f date \u51fd\u6570\u652f\u6301\u7684\u683c\u5f0f\u3002</p><p>\u53ef\u4ee5\u5c06\u65f6\u533a\u4f5c\u4e3a\u7b2c\u4e8c\u4e2a\u53c2\u6570\u4f20\u5165:</p><pre><code>\n{% if date(user.created_at) &lt; date('+2days', 'Europe/Paris') %}\n\    {# do something #}\n{% endif %}\n</code></pre><p>\u5982\u679c\u4e0d\u4f20\u53c2\u6570, \u8be5\u51fd\u6570\u5c06\u8fd4\u56de\u5f53\u524d\u65e5\u671f:</p><pre><code>\n{% if date(user.created_at) &lt; date() %}\n    {# always! #}\n{% endif %}\n</code></pre><p>\u53ef\u4ee5\u901a\u8fc7\u5728 <code>core</code> \u6269\u5c55\u5b9e\u4f8b\u4e0a\u8c03\u7528 <code>setTimezone()</code> \u6765\u5168\u5c40\u8bbe\u7f6e\u9ed8\u8ba4\u65f6\u533a:</p><pre><code>\n$twig = new Twig_Environment($loader);\n$twig->getExtension('core')->setTimezone('Europe/Paris');\n</code></pre>
FUNCTION_dump=<p style="font-weight: bold; font-size: 1.2em">dump</p><p><code>dump</code> \u51fd\u6570\u8f6c\u50a8\u6709\u5173\u6a21\u677f\u53d8\u91cf\u7684\u4fe1\u606f\u3002\u8fd9\u5bf9\u4e8e\u901a\u8fc7\u5185\u7701\u53d8\u91cf\u6765\u8c03\u8bd5\u884c\u4e3a\u4e0d\u7b26\u5408\u9884\u671f\u7684\u6a21\u677f\u6700\u4e3a\u6709\u7528:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ dump(user) }}\n</code></pre><p><code>dump</code> \u51fd\u6570\u9ed8\u8ba4\u4e0d\u53ef\u7528\u3002\u521b\u5efa Twig \u73af\u5883\u65f6\u5fc5\u987b\u663e\u5f0f\u6dfb\u52a0 <code>Twig_Extension_Debug</code> \u6269\u5c55:</p><pre><code>\n$twig = new Twig_Environment($loader, array(\n\    'debug' => true,\n\    // ...\n));\n$twig->addExtension(new Twig_Extension_Debug());\n</code></pre><p>\u5373\u4f7f\u5df2\u542f\u7528, \u5982\u679c\u73af\u5883\u4e0a\u7684 debug \u9009\u9879\u672a\u542f\u7528, dump \u51fd\u6570\u4e5f\u4e0d\u4f1a\u663e\u793a\u4efb\u4f55\u5185\u5bb9 (\u4ee5\u907f\u514d\u5728\u751f\u4ea7\u670d\u52a1\u5668\u4e0a\u6cc4\u9732\u8c03\u8bd5\u4fe1\u606f)\u3002</p><p>\u5728 HTML \u4e0a\u4e0b\u6587\u4e2d, \u8bf7\u7528 <code>pre</code> \u6807\u7b7e\u5305\u88f9\u8f93\u51fa\u4ee5\u4fbf\u4e8e\u9605\u8bfb:</p><pre><code>\n&lt;pre>\n\    {{ dump(user) }}\n&lt;/pre>\n</code></pre><p>\u5f53\u542f\u7528 XDebug \u4e14 <code>html_errors</code> \u4e3a <code>on</code> \u65f6, \u65e0\u9700\u4f7f\u7528 <code>pre</code> \u6807\u7b7e; \u542f\u7528 XDebug \u8fd8\u80fd\u8ba9\u8f93\u51fa\u66f4\u7f8e\u89c2\u3002</p><p>\u53ef\u4ee5\u901a\u8fc7\u5c06\u591a\u4e2a\u53d8\u91cf\u4f5c\u4e3a\u9644\u52a0\u53c2\u6570\u4f20\u5165\u6765\u8c03\u8bd5\u5b83\u4eec:</p><pre><code>\n{{ dump(user, categories) }}</code></pre><p>\u5982\u679c\u4e0d\u4f20\u4efb\u4f55\u503c, \u5c06\u8f6c\u50a8\u5f53\u524d\u4e0a\u4e0b\u6587\u4e2d\u7684\u6240\u6709\u53d8\u91cf:</p><pre><code>\n{{ dump() }}</code></pre>
FUNCTION_parent=<p style="font-weight: bold; font-size: 1.2em">parent</p><p>\u5f53\u6a21\u677f\u4f7f\u7528\u7ee7\u627f\u65f6, \u53ef\u4ee5\u5728\u8986\u76d6\u67d0\u4e2a\u5757\u65f6\u4f7f\u7528 <code>parent</code> \u51fd\u6570\u6e32\u67d3\u7236\u5757\u7684\u5185\u5bb9:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% extends "base.html" %}\n\n{% block sidebar %}\n\    &lt;h3>Table Of Contents&lt;/h3>\n\    ...\n\    {{ parent() }}\n{% endblock %}\n</code></pre><p><code>parent()</code> \u8c03\u7528\u5c06\u8fd4\u56de <code>base.html</code> \u6a21\u677f\u4e2d\u5b9a\u4e49\u7684 <code>sidebar</code> \u5757\u7684\u5185\u5bb9\u3002</p>
FUNCTION_random=<p style="font-weight: bold; font-size: 1.2em">random</p><p><code>random</code> \u51fd\u6570\u6839\u636e\u63d0\u4f9b\u7684\u53c2\u6570\u7c7b\u578b\u8fd4\u56de\u4e00\u4e2a\u968f\u673a\u503c:</p><ul><li>a random item from a sequence;</li><li>a random character from a string;</li><li>a random integer between 0 and the integer parameter (inclusive).</li></ul><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ random(['apple', 'orange', 'citrus']) }} {# example output: orange #}\n{{ random('ABC') }}                         {# example output: C #}\n{{ random() }}                              {# example output: 15386094 (works as native PHP `mt_rand`_ function) #}\n{{ random(5) }}                             {# example output: 3 #}\n</code></pre>
FUNCTION_range=<p style="font-weight: bold; font-size: 1.2em">range</p><p>\u8fd4\u56de\u4e00\u4e2a\u5305\u542b\u6574\u6570\u7b49\u5dee\u6570\u5217\u7684\u5217\u8868:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% for i in range(0, 3) %}\n\    {{ i }},\n{% endfor %}\n\n{# returns 0, 1, 2, 3 #}\n</code></pre><p>\u5982\u679c\u63d0\u4f9b\u4e86 step (\u4f5c\u4e3a\u7b2c\u4e09\u4e2a\u53c2\u6570), \u5b83\u6307\u5b9a\u589e\u91cf (\u6216\u51cf\u91cf):</p><pre><code>\n{% for i in range(0, 6, 2) %}\n\    {{ i }},\n{% endfor %}\n\n{# returns 0, 2, 4, 6 #}\n</code></pre><p>Twig \u5185\u7f6e\u7684 .. \u8fd0\u7b97\u7b26\u53ea\u662f <code>range</code> \u51fd\u6570\u7684\u8bed\u6cd5\u7cd6 (\u6b65\u957f\u4e3a 1):</p><pre><code>\n{% for i in 0..3 %}\n\    {{ i }},\n{% endfor %}\n</code></pre>
OPERATOR_in=<p style="font-weight: bold; font-size: 1.2em">in</p><p><code>in</code> \u8fd0\u7b97\u7b26\u6267\u884c\u5305\u542b\u6027\u6d4b\u8bd5\u3002<p></p>It returns <code>true</code> if the left operand is contained in the right:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{# returns true #}\n\n{{ 1 in [1, 2, 3] }}\n\n{{ 'cd' in 'abcde' }}\n</code></pre><p>To perform a negative test, use the <code>not in</code> operator:<p><pre><code>\n{% if 1 not in [1, 2, 3] %}\n\n{# is equivalent to #}\n{% if not (1 in [1, 2, 3]) %}\n</code></pre>
OPERATOR_as=<p style="font-weight: bold; font-size: 1.2em">as</p><p>\u4ece\u5bfc\u5165\u7684\u6a21\u677f\u521b\u5efa\u65b0\u53d8\u91cf\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% import 'forms.html' as forms %}</code></pre>
OPERATOR_is=<p style="font-weight: bold; font-size: 1.2em">is</p><p><code>is</code> \u8fd0\u7b97\u7b26\u6267\u884c\u6d4b\u8bd5\u3002\u6d4b\u8bd5\u53ef\u7528\u4e8e\u9488\u5bf9\u5e38\u89c1\u8868\u8fbe\u5f0f\u5bf9\u53d8\u91cf\u8fdb\u884c\u6d4b\u8bd5\u3002\u53f3\u64cd\u4f5c\u6570\u662f\u6d4b\u8bd5\u7684\u540d\u79f0:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{# find out if a variable is odd #}\n\n{{ name is odd }}\n</code></pre><p>Tests can accept arguments too:<p><pre><code>\n{% if loop.index is divisibleby(3) %}\n</code></pre><p>Tests can be negated by using the <code>is not</code> operator:<p><pre><code>\n{% if loop.index is not divisibleby(3) %}\n\n{# is equivalent to #}\n{% if not (loop.index is divisibleby(3)) %}\n</code></pre>
OPERATOR_and=<p style="font-weight: bold; font-size: 1.2em">and</p><p>\u5f53\u5de6\u64cd\u4f5c\u6570\u548c\u53f3\u64cd\u4f5c\u6570\u90fd\u4e3a true \u65f6\u8fd4\u56de <code>true</code>\u3002</p>
OPERATOR_or=<p style="font-weight: bold; font-size: 1.2em">or</p><p>\u5f53\u5de6\u64cd\u4f5c\u6570\u6216\u53f3\u64cd\u4f5c\u6570\u4e3a true \u65f6\u8fd4\u56de <code>true</code>\u3002</p>
OPERATOR_not=<p style="font-weight: bold; font-size: 1.2em">not</p><p>\u5bf9\u8bed\u53e5\u53d6\u53cd\u3002</p>
OPERATOR_b-and=<p style="font-weight: bold; font-size: 1.2em">b-and</p><p>\u6309\u4f4d <code>and</code> (\u4e0e) \u8fd0\u7b97\u3002</p>
OPERATOR_b-or=<p style="font-weight: bold; font-size: 1.2em">b-or</p><p>\u6309\u4f4d <code>or</code> (\u6216) \u8fd0\u7b97\u3002</p>
OPERATOR_b-xor=<p style="font-weight: bold; font-size: 1.2em">b-xor</p><p>\u6309\u4f4d <code>xor</code> (\u5f02\u6216) \u8fd0\u7b97\u3002</p>
FILTER_abs=<p style="font-weight: bold; font-size: 1.2em">abs</p><p><code>abs</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u7edd\u5bf9\u503c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{\# number = -5 \#}\n\n{{ number|abs }}\n\n{\# outputs 5 \#}\n</code></pre>
FILTER_capitalize=<p style="font-weight: bold; font-size: 1.2em">capitalize</p><p><code>capitalize</code> \u8fc7\u6ee4\u5668\u5c06\u503c\u9996\u5b57\u6bcd\u5927\u5199\u3002\u7b2c\u4e00\u4e2a\u5b57\u7b26\u5c06\u53d8\u4e3a\u5927\u5199, \u5176\u4f59\u5b57\u7b26\u53d8\u4e3a\u5c0f\u5199:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ 'my first car'|capitalize }}\n\n{\# outputs 'My first car' \#}\n</code></pre>
FILTER_convert_encoding=<p style="font-weight: bold; font-size: 1.2em">convert_encoding</p><p><code>convert_encoding</code> \u8fc7\u6ee4\u5668\u5c06\u5b57\u7b26\u4e32\u4ece\u4e00\u79cd\u7f16\u7801\u8f6c\u6362\u4e3a\u53e6\u4e00\u79cd\u7f16\u7801\u3002\u7b2c\u4e00\u4e2a\u53c2\u6570\u662f\u9884\u671f\u7684\u8f93\u51fa\u5b57\u7b26\u96c6, \u7b2c\u4e8c\u4e2a\u53c2\u6570\u662f\u8f93\u5165\u5b57\u7b26\u96c6:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ data|convert_encoding('UTF-8', 'iso-2022-jp') }}\n</code></pre><p>\u6b64\u8fc7\u6ee4\u5668\u4f9d\u8d56\u4e8e iconv \u6216 mbstring \u6269\u5c55, \u56e0\u6b64\u5fc5\u987b\u5b89\u88c5\u5176\u4e2d\u4e4b\u4e00\u3002\u5982\u679c\u4e24\u8005\u90fd\u5df2\u5b89\u88c5, \u9ed8\u8ba4\u4f7f\u7528 mbstring (Twig 1.8.1 \u4e4b\u524d\u9ed8\u8ba4\u4f7f\u7528 iconv)\u3002</p>
FILTER_date=<p style="font-weight: bold; font-size: 1.2em">date</p><p><code>date</code> \u8fc7\u6ee4\u5668\u5c06\u65e5\u671f\u683c\u5f0f\u5316\u4e3a\u7ed9\u5b9a\u7684\u683c\u5f0f:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ post.published_at|date("m/d/Y") }}\n</code></pre><p><code>date</code> \u8fc7\u6ee4\u5668\u63a5\u53d7\u5b57\u7b26\u4e32 (\u5fc5\u987b\u4e3a <a href="http://www.php.net/strtotime">strtotime</a> \u51fd\u6570\u652f\u6301\u7684\u683c\u5f0f)\u3001<a href="http://www.php.net/DateTime">DateTime</a> \u5b9e\u4f8b\u6216 <a href="http://www.php.net/DateInterval">DateInterval</a> \u5b9e\u4f8b\u3002\u4f8b\u5982, \u8981\u663e\u793a\u5f53\u524d\u65e5\u671f, \u8bf7\u8fc7\u6ee4\u5355\u8bcd "now":</p><pre><code>\n{{ "now"|date("m/d/Y") }}\n</code></pre><p>\u8981\u8f6c\u4e49\u65e5\u671f\u683c\u5f0f\u4e2d\u7684\u5355\u8bcd\u548c\u5b57\u7b26, \u8bf7\u5728\u6bcf\u4e2a\u5b57\u7b26\u524d\u4f7f\u7528 <code>\\\\</code>:</p><pre><code>\n{{ post.published_at|date("F jS \\\\a\\\\t g:ia") }}\n</code></pre><p>\u8fd8\u53ef\u4ee5\u6307\u5b9a\u65f6\u533a:</p><pre><code>\n{{ post.published_at|date("m/d/Y", "Europe/Paris") }}\n</code></pre><p>\u5982\u679c\u672a\u63d0\u4f9b\u683c\u5f0f, Twig \u5c06\u4f7f\u7528\u9ed8\u8ba4\u683c\u5f0f: <code>F j, Y H:i</code>\u3002\u53ef\u4ee5\u901a\u8fc7\u5728 <code>core</code> \u6269\u5c55\u5b9e\u4f8b\u4e0a\u8c03\u7528 <code>setDateFormat()</code> \u65b9\u6cd5\u8f7b\u677e\u66f4\u6539\u6b64\u9ed8\u8ba4\u503c\u3002\u7b2c\u4e00\u4e2a\u53c2\u6570\u662f\u65e5\u671f\u7684\u9ed8\u8ba4\u683c\u5f0f, \u7b2c\u4e8c\u4e2a\u53c2\u6570\u662f\u65e5\u671f\u95f4\u9694\u7684\u9ed8\u8ba4\u683c\u5f0f:</p><pre><code>\n$twig = new Twig_Environment($loader);\n$twig->getExtension('core')->setDateFormat('d/m/Y', '%d days');\n</code></pre><p>\u4e5f\u53ef\u4ee5\u901a\u8fc7\u8c03\u7528 <code>setTimezone()</code> \u6765\u5168\u5c40\u8bbe\u7f6e\u9ed8\u8ba4\u65f6\u533a:</p><pre><code>\n$twig = new Twig_Environment($loader);\n$twig->getExtension('core')->setTimezone('Europe/Paris');\n</code></pre><p>\u5982\u679c\u4f20\u7ed9 <code>date</code> \u8fc7\u6ee4\u5668\u7684\u503c\u4e3a null, \u9ed8\u8ba4\u4f1a\u8fd4\u56de\u5f53\u524d\u65e5\u671f\u3002\u5982\u679c\u5e0c\u671b\u8fd4\u56de\u7a7a\u5b57\u7b26\u4e32\u800c\u4e0d\u662f\u5f53\u524d\u65e5\u671f, \u8bf7\u4f7f\u7528\u4e09\u5143\u8fd0\u7b97\u7b26:</p><pre><code>\n{{ post.published_at is empty ? "" : post.published_at|date("m/d/Y") }}\n</code></pre>
FILTER_date_modify=<p style="font-weight: bold; font-size: 1.2em">date_modify</p><p><code>date_modify</code> \u8fc7\u6ee4\u5668\u4f7f\u7528\u7ed9\u5b9a\u7684\u4fee\u9970\u7b26\u5b57\u7b26\u4e32\u4fee\u6539\u65e5\u671f:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ post.published_at|date_modify("+1 day")|date("m/d/Y") }}\n</code></pre><p><code>date_modify</code> \u8fc7\u6ee4\u5668\u63a5\u53d7\u5b57\u7b26\u4e32 (\u5fc5\u987b\u4e3a <a href="http://www.php.net/strtotime">strtotime</a> \u51fd\u6570\u652f\u6301\u7684\u683c\u5f0f) \u6216 <a href="http://www.php.net/DateTime">DateTime</a> \u5b9e\u4f8b\u3002\u53ef\u4ee5\u8f7b\u677e\u5730\u5c06\u5176\u4e0e <a href="http://twig.sensiolabs.org/doc/filters/date_modify.html#id1">`date`</a>_ \u8fc7\u6ee4\u5668\u7ed3\u5408\u4f7f\u7528\u8fdb\u884c\u683c\u5f0f\u5316\u3002</p>
FILTER_default=<p style="font-weight: bold; font-size: 1.2em">default</p><p>\u5982\u679c\u503c\u672a\u5b9a\u4e49\u6216\u4e3a\u7a7a, <code>default</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u4f20\u5165\u7684\u9ed8\u8ba4\u503c, \u5426\u5219\u8fd4\u56de\u53d8\u91cf\u7684\u503c:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ var|default('var is not defined') }}\n\n{{ var.foo|default('foo item on var is not defined') }}\n\n{{ var['foo']|default('foo item on var is not defined') }}\n\n{{ ''|default('passed var is empty')  }}\n</code></pre><p>\u5bf9\u5728\u67d0\u4e9b\u65b9\u6cd5\u8c03\u7528\u4e2d\u4f7f\u7528\u53d8\u91cf\u7684\u8868\u8fbe\u5f0f\u4f7f\u7528 <code>default</code> \u8fc7\u6ee4\u5668\u65f6, \u53ea\u8981\u53d8\u91cf\u53ef\u80fd\u672a\u5b9a\u4e49, \u5c31\u52a1\u5fc5\u4f7f\u7528 <code>default</code> \u8fc7\u6ee4\u5668:</p><pre><code>\n{{ var.method(foo|default('foo'))|default('foo') }}\n</code></pre>
FILTER_escape=<p style="font-weight: bold; font-size: 1.2em">escape</p><p><code>escape</code> \u8fc7\u6ee4\u5668\u8f6c\u4e49\u5b57\u7b26\u4e32\u4ee5\u4fbf\u5b89\u5168\u5730\u63d2\u5165\u6700\u7ec8\u8f93\u51fa\u3002\u5b83\u652f\u6301\u4e0d\u540c\u7684\u8f6c\u4e49\u7b56\u7565, \u5177\u4f53\u53d6\u51b3\u4e8e\u6a21\u677f\u4e0a\u4e0b\u6587\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u9ed8\u8ba4\u4f7f\u7528 HTML \u8f6c\u4e49\u7b56\u7565:</p><pre><code>\n{{ user.username|escape }}\n</code></pre><p>\u4e3a\u65b9\u4fbf\u8d77\u89c1, <code>e</code> \u8fc7\u6ee4\u5668\u88ab\u5b9a\u4e49\u4e3a\u5176\u522b\u540d:</p><pre><code>\n{{ user.username|e }}\n</code></pre><p>\u501f\u52a9\u5b9a\u4e49\u8f6c\u4e49\u7b56\u7565\u7684\u53ef\u9009\u53c2\u6570, <code>escape</code> \u8fc7\u6ee4\u5668\u8fd8\u53ef\u7528\u4e8e HTML \u4ee5\u5916\u7684\u5176\u4ed6\u4e0a\u4e0b\u6587:</p><pre><code>\n{{ user.username|e }}\n{\# is equivalent to \#}\n{{ user.username|e('html') }}\n</code></pre><p>\u4e0b\u9762\u662f\u5982\u4f55\u8f6c\u4e49\u5305\u542b\u5728 JavaScript \u4ee3\u7801\u4e2d\u7684\u53d8\u91cf:</p><pre><code>\n{{ user.username|escape('js') }}\n{{ user.username|e('js') }}\n</code></pre><p><code>escape</code> \u8fc7\u6ee4\u5668\u652f\u6301\u4ee5\u4e0b\u8f6c\u4e49\u7b56\u7565:</p><ul><li><code>html</code>: escapes a string for the <strong>HTML body</strong> context.</li><li><code>js</code>: escapes a string for the <strong>JavaScript context</strong>.</li><li><code>css</code>: escapes a string for the <strong>CSS context</strong>. CSS escaping can be applied to any string being inserted into CSS and escapes everything except alphanumerics.</li><li><code>url</code>: escapes a string for the <strong>URI or parameter contexts</strong>. This should not be used to escape an entire URI; only a subcomponent being inserted.</li><li><code>html_attr</code>: escapes a string for the <strong>HTML attribute</strong> context.</li></ul>
FILTER_format=<p style="font-weight: bold; font-size: 1.2em">format</p><p><code>format</code> \u8fc7\u6ee4\u5668\u901a\u8fc7\u66ff\u6362\u5360\u4f4d\u7b26\u6765\u683c\u5f0f\u5316\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32 (\u5360\u4f4d\u7b26\u9075\u5faa <a href="http://www.php.net/printf">printf</a> \u8bb0\u6cd5):</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ "I like %s and %s."|format(foo, "bar") }}\n\n{\# returns I like foo and bar\n\   if the foo parameter equals to the foo string. \#}\n</code></pre>
FILTER_join=<p style="font-weight: bold; font-size: 1.2em">join</p><p><code>join</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u4e00\u4e2a\u5b57\u7b26\u4e32, \u5b83\u662f\u5e8f\u5217\u4e2d\u5404\u9879\u76ee\u7684\u4e32\u8054:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ [1, 2, 3]|join }}\n{\# returns 123 \#}\n</code></pre><p>\u5143\u7d20\u4e4b\u95f4\u7684\u5206\u9694\u7b26\u9ed8\u8ba4\u4e3a\u7a7a\u5b57\u7b26\u4e32, \u4f46\u53ef\u4ee5\u901a\u8fc7\u53ef\u9009\u7684\u7b2c\u4e00\u4e2a\u53c2\u6570\u5b9a\u4e49\u5b83:</p><pre><code>\n{{ [1, 2, 3]|join('|') }}\n{\# returns 1|2|3 \#}\n</code></pre>
FILTER_json_encode=<p style="font-weight: bold; font-size: 1.2em">json_encode</p><p><code>json_encode</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u5b57\u7b26\u4e32\u7684 JSON \u8868\u793a\u5f62\u5f0f:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ data|json_encode() }}\n</code></pre>
FILTER_keys=<p style="font-weight: bold; font-size: 1.2em">keys</p><p><code>keys</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u6570\u7ec4\u7684\u952e\u3002\u5f53\u9700\u8981\u904d\u5386\u6570\u7ec4\u7684\u952e\u65f6\u975e\u5e38\u6709\u7528:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% for key in array|keys %}\n\    ...\n{% endfor %}\n</code></pre>
FILTER_length=<p style="font-weight: bold; font-size: 1.2em">length</p><p><code>length</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u5e8f\u5217\u6216\u6620\u5c04\u7684\u9879\u6570, \u6216\u5b57\u7b26\u4e32\u7684\u957f\u5ea6:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% if users|length > 10 %}\n\    ...\n{% endif %}\n</code></pre>
FILTER_lower=<p style="font-weight: bold; font-size: 1.2em">lower</p><p><code>lower</code> \u8fc7\u6ee4\u5668\u5c06\u503c\u8f6c\u6362\u4e3a\u5c0f\u5199:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ 'WELCOME'|lower }}\n\n{\# outputs 'welcome' \#}\n</code></pre>
FILTER_merge=<p style="font-weight: bold; font-size: 1.2em">merge</p><p><code>merge</code> \u8fc7\u6ee4\u5668\u5c06\u4e00\u4e2a\u6570\u7ec4\u548c\u53e6\u4e00\u4e2a\u6570\u7ec4\u5408\u5e76:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% set values = [1, 2] %}\n\n{% set values = values|merge(['apple', 'orange']) %}\n\n{\# values now contains [1, 2, 'apple', 'orange'] \#}\n</code></pre><p>\u65b0\u503c\u88ab\u6dfb\u52a0\u5230\u73b0\u6709\u503c\u7684\u672b\u5c3e\u3002</p><p><code>merge</code> \u8fc7\u6ee4\u5668\u4e5f\u9002\u7528\u4e8e\u54c8\u5e0c (hash):</p><pre><code>\n{% set items = { 'apple': 'fruit', 'orange': 'fruit', 'peugeot': 'unknown' } %}\n\n{% set items = items|merge({ 'peugeot': 'car', 'renault': 'car' }) %}\n\n{\# items now contains { 'apple': 'fruit', 'orange': 'fruit', 'peugeot': 'car', 'renault': 'car' } \#}\n</code></pre><p>\u5bf9\u4e8e\u54c8\u5e0c, \u5408\u5e76\u8fc7\u7a0b\u57fa\u4e8e\u952e\u8fdb\u884c: \u5982\u679c\u952e\u4e0d\u5b58\u5728\u5219\u6dfb\u52a0, \u4f46\u5982\u679c\u952e\u5df2\u5b58\u5728, \u5176\u503c\u5c06\u88ab\u8986\u76d6\u3002</p><p>\u5982\u679c\u4f60\u60f3\u786e\u4fdd\u6570\u7ec4\u4e2d\u7684\u67d0\u4e9b\u503c\u5df2\u5b9a\u4e49 (\u901a\u8fc7\u7ed9\u5b9a\u7684\u9ed8\u8ba4\u503c), \u8bf7\u5728\u8c03\u7528\u4e2d\u98a0\u5012\u4e24\u4e2a\u5143\u7d20\u7684\u987a\u5e8f:</p><pre><code>\n{% set items = { 'apple': 'fruit', 'orange': 'fruit' } %}\n\n{% set items = { 'apple': 'unknown' }|merge(items) %}\n\n{\# items now contains { 'apple': 'fruit', 'orange': 'fruit' } \#}\n</code></pre>
FILTER_nl2br=<p style="font-weight: bold; font-size: 1.2em">nl2br</p><p><code>nl2br</code> \u8fc7\u6ee4\u5668\u5728\u5b57\u7b26\u4e32\u4e2d\u6240\u6709\u6362\u884c\u7b26\u4e4b\u524d\u63d2\u5165 HTML \u6362\u884c\u6807\u8bb0:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ "I like Twig.\\nYou will like it too."|nl2br }}\n{\# outputs\n\n\    I like Twig.&lt;br />\n\    You will like it too.\n\n\#}\n</code></pre><p><code>nl2br</code> \u8fc7\u6ee4\u5668\u5728\u5e94\u7528\u8f6c\u6362\u4e4b\u524d\u4f1a\u5148\u5bf9\u8f93\u5165\u8fdb\u884c\u9884\u8f6c\u4e49\u3002</p>
FILTER_number_format=<p style="font-weight: bold; font-size: 1.2em">number_format</p><p><code>number_format</code> \u8fc7\u6ee4\u5668\u683c\u5f0f\u5316\u6570\u5b57\u3002\u5b83\u662f PHP <a href="http://php.net/number_format">number_format</a> \u51fd\u6570\u7684\u5c01\u88c5:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ 200.35|number_format }}\n</code></pre><p>\u53ef\u4ee5\u4f7f\u7528\u9644\u52a0\u53c2\u6570\u63a7\u5236\u5c0f\u6570\u4f4d\u6570\u3001\u5c0f\u6570\u70b9\u7b26\u53f7\u548c\u5343\u4f4d\u5206\u9694\u7b26:</p><pre><code>\n{{ 9800.333|number_format(2, '.', ',') }}\n</code></pre><p>\u5982\u679c\u672a\u63d0\u4f9b\u683c\u5f0f\u5316\u9009\u9879, Twig \u5c06\u4f7f\u7528\u4ee5\u4e0b\u9ed8\u8ba4\u683c\u5f0f\u5316\u9009\u9879:</p><ul><li>0 decimal places.</li><li>. as the decimal point.</li><li>, as the thousands separator.</li></ul><p>\u8fd9\u4e9b\u9ed8\u8ba4\u503c\u53ef\u4ee5\u901a\u8fc7\u6838\u5fc3\u6269\u5c55\u8f7b\u677e\u66f4\u6539:</p><pre><code>\n$twig = new Twig_Environment($loader);\n$twig->getExtension('core')->setNumberFormat(3, '.', ',');\n</code></pre><p>\u4e3a <code>number_format</code> \u8bbe\u7f6e\u7684\u9ed8\u8ba4\u503c\u53ef\u4ee5\u5728\u6bcf\u6b21\u8c03\u7528\u65f6\u901a\u8fc7\u9644\u52a0\u53c2\u6570\u8986\u76d6\u3002</p>
FILTER_raw=<p style="font-weight: bold; font-size: 1.2em">raw</p><p><code>raw</code> \u8fc7\u6ee4\u5668\u5c06\u503c\u6807\u8bb0\u4e3a "\u5b89\u5168", \u8fd9\u610f\u5473\u7740\u5728\u542f\u7528\u81ea\u52a8\u8f6c\u4e49\u7684\u73af\u5883\u4e2d, \u5982\u679c <code>raw</code> \u662f\u5e94\u7528\u4e8e\u8be5\u53d8\u91cf\u7684\u6700\u540e\u4e00\u4e2a\u8fc7\u6ee4\u5668, \u5219\u8be5\u53d8\u91cf\u4e0d\u4f1a\u88ab\u8f6c\u4e49:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% autoescape true %}\n\    {{ var|raw }} {\# var won't be escaped \#}\n{% endautoescape %}\n</code></pre>
FILTER_replace=<p style="font-weight: bold; font-size: 1.2em">replace</p><p><code>replace</code> \u8fc7\u6ee4\u5668\u901a\u8fc7\u66ff\u6362\u5360\u4f4d\u7b26\u6765\u683c\u5f0f\u5316\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32 (\u5360\u4f4d\u7b26\u4e3a\u81ea\u7531\u683c\u5f0f):</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ "I like %this% and %that%."|replace({'%this%': foo, '%that%': "bar"}) }}\n\n{\# returns I like foo and bar\n\   if the foo parameter equals to the foo string. \#}\n</code></pre>
FILTER_reverse=<p style="font-weight: bold; font-size: 1.2em">reverse</p><p><code>reverse</code> \u8fc7\u6ee4\u5668\u53cd\u8f6c\u5e8f\u5217\u3001\u6620\u5c04\u6216\u5b57\u7b26\u4e32:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% for use in users|reverse %}\n\    ...\n{% endfor %}\n\n{{ '1234'|reverse }}\n\n{\# outputs 4321 \#}\n</code></pre>
FILTER_slice=<p style="font-weight: bold; font-size: 1.2em">slice</p><p><code>slice</code> \u8fc7\u6ee4\u5668\u63d0\u53d6\u5e8f\u5217\u3001\u6620\u5c04\u6216\u5b57\u7b26\u4e32\u7684\u4e00\u90e8\u5206:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% for i in [1, 2, 3, 4]|slice(1, 2) %}\n\    {\# will iterate over 2 and 3 \#}\n{% endfor %}\n\n{{ '1234'|slice(1, 2) }}\n\n{\# outputs 23 \#}\n</code></pre><p>\u8d77\u59cb\u4f4d\u7f6e\u548c\u957f\u5ea6\u90fd\u53ef\u4ee5\u4f7f\u7528\u4efb\u4f55\u6709\u6548\u7684\u8868\u8fbe\u5f0f:</p><pre><code>\n{% for i in [1, 2, 3, 4]|slice(start, length) %}\n\    {\# ... \#}\n{% endfor %}\n</code></pre><p>\u4f5c\u4e3a\u8bed\u6cd5\u7cd6, \u8fd8\u53ef\u4ee5\u4f7f\u7528 <code>[]</code> \u8bb0\u6cd5:</p><pre><code>\n{% for i in [1, 2, 3, 4][start:length] %}\n\    {\# ... \#}\n{% endfor %}\n\n{{ '1234'[1:2] }}\n</code></pre><p>\u5bf9\u4e8e\u6570\u7ec4, <code>slice</code> \u8fc7\u6ee4\u5668\u7684\u884c\u4e3a\u4e0e PHP \u7684 <a href="http://php.net/array_slice">array_slice</a> \u51fd\u6570\u76f8\u540c; \u5bf9\u4e8e\u5b57\u7b26\u4e32, \u5219\u4e0e <a href="http://php.net/substr">substr</a> \u76f8\u540c\u3002</p><p>\u5982\u679c start \u4e3a\u975e\u8d1f\u6570, \u5e8f\u5217\u5c06\u4ece\u53d8\u91cf\u4e2d\u7684\u8be5\u4f4d\u7f6e\u5f00\u59cb\u3002\u5982\u679c start \u4e3a\u8d1f\u6570, \u5e8f\u5217\u5c06\u4ece\u8ddd\u53d8\u91cf\u672b\u5c3e\u8be5\u8ddd\u79bb\u7684\u4f4d\u7f6e\u5f00\u59cb\u3002</p><p>\u5982\u679c\u7ed9\u5b9a\u7684 length \u4e3a\u6b63\u6570, \u5e8f\u5217\u5c06\u6700\u591a\u5305\u542b\u8fd9\u4e48\u591a\u5143\u7d20\u3002\u5982\u679c\u53d8\u91cf\u77ed\u4e8e\u8be5\u957f\u5ea6, \u5219\u53ea\u5305\u542b\u53ef\u7528\u7684\u53d8\u91cf\u5143\u7d20\u3002\u5982\u679c\u7ed9\u5b9a\u7684 length \u4e3a\u8d1f\u6570, \u5e8f\u5217\u5c06\u5728\u8ddd\u53d8\u91cf\u672b\u5c3e\u8fd9\u4e48\u591a\u7684\u5143\u7d20\u5904\u505c\u6b62\u3002\u5982\u679c\u7701\u7565, \u5e8f\u5217\u5c06\u5305\u542b\u4ece\u504f\u79fb\u91cf\u76f4\u5230\u53d8\u91cf\u672b\u5c3e\u7684\u6240\u6709\u5185\u5bb9\u3002</p><p>\u5b83\u4e5f\u9002\u7528\u4e8e\u5b9e\u73b0 <a href="http://php.net/manual/en/class.traversable.php">Traversable</a> \u63a5\u53e3\u7684\u5bf9\u8c61\u3002</p>
FILTER_sort=<p style="font-weight: bold; font-size: 1.2em">sort</p><p><code>sort</code> \u8fc7\u6ee4\u5668\u5bf9\u6570\u7ec4\u6392\u5e8f:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% for use in users|sort %}\n\    ...\n{% endfor %}\n</code></pre>
FILTER_striptags=<p style="font-weight: bold; font-size: 1.2em">striptags</p><p><code>striptags</code> \u8fc7\u6ee4\u5668\u53bb\u9664 SGML/XML \u6807\u7b7e, \u5e76\u5c06\u76f8\u90bb\u7a7a\u767d\u66ff\u6362\u4e3a\u4e00\u4e2a\u7a7a\u683c:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{% some_html|striptags %}\n</code></pre>
FILTER_title=<p style="font-weight: bold; font-size: 1.2em">title</p><p><code>title</code> \u8fc7\u6ee4\u5668\u8fd4\u56de\u503c\u7684\u6807\u9898\u5f0f\u5927\u5199\u7248\u672c\u3002\u5355\u8bcd\u5c06\u4ee5\u5927\u5199\u5b57\u6bcd\u5f00\u5934, \u5176\u4f59\u5b57\u7b26\u4e3a\u5c0f\u5199:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ 'my first car'|title }}\n\n{\# outputs 'My First Car' \#}\n</code></pre>
FILTER_trim=<p style="font-weight: bold; font-size: 1.2em">trim</p><p><code>trim</code> \u8fc7\u6ee4\u5668\u53bb\u9664\u5b57\u7b26\u4e32\u5f00\u5934\u548c\u7ed3\u5c3e\u7684\u7a7a\u767d (\u6216\u5176\u4ed6\u5b57\u7b26):</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ '  I like Twig.  '|trim }}\n\n{\# outputs 'I like Twig.' \#}\n\n{{ '  I like Twig.'|trim('.') }}\n\n{\# outputs '  I like Twig' \#}\n</code></pre>
FILTER_upper=<p style="font-weight: bold; font-size: 1.2em">upper</p><p><code>upper</code> \u8fc7\u6ee4\u5668\u5c06\u503c\u8f6c\u6362\u4e3a\u5927\u5199:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ 'welcome'|upper }}\n\n{\# outputs 'WELCOME' \#}\n</code></pre>
FILTER_url_encode=<p style="font-weight: bold; font-size: 1.2em">url_encode</p><p><code>url_encode</code> \u8fc7\u6ee4\u5668\u5bf9\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32\u8fdb\u884c URL \u7f16\u7801:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ data|url_encode() }}\n</code></pre>
FILTER_trans=<p style="font-weight: bold; font-size: 1.2em">trans</p><p><code>i18n</code> \u6269\u5c55\u4e3a Twig \u6dfb\u52a0\u4e86 gettext \u652f\u6301\u3002\u4f60\u9700\u8981\u5728\u4f7f\u7528 trans \u5757\u4e4b\u524d\u6ce8\u518c\u6b64\u6269\u5c55:</p><p style="font-weight: bold; font-size: 1.1em">Registration</p><pre><code>\n$twig->addExtension(new Twig_Extensions_Extension_I18n());\n</code></pre><p>\u6ce8\u610f, \u5728\u6e32\u67d3\u4efb\u4f55\u56fd\u9645\u5316\u6a21\u677f\u4e4b\u524d, \u5fc5\u987b\u5148\u914d\u7f6e <code>gettext</code> \u6269\u5c55\u3002\u4e0b\u9762\u662f\u6765\u81ea <a href="http://php.net/manual/en/function.gettext.php">PHP \u6587\u6863</a>\u7684\u7b80\u5355\u914d\u7f6e\u793a\u4f8b:</p><p style="font-weight: bold; font-size: 1.1em">Configuration</p><pre><code>\n// Set language to French\nputenv('LC_ALL=fr_FR');\nsetlocale(LC_ALL, 'fr_FR');\n\n// Specify the location of the translation tables\nbindtextdomain('myAppPhp', 'includes/locale');\nbind_textdomain_codeset('myAppPhp', 'UTF-8');\n\n// Choose domain\ntextdomain('myAppPhp');\n$twig->addExtension(new Twig_Extensions_Extension_I18n());\n</code></pre><p style="font-weight: bold; font-size: 1.1em">Usage</p>{{ var|default(default_value|trans) }}\n</code></pre>
FILTER_truncate=<p style="font-weight: bold; font-size: 1.2em">truncate</p><p><code>truncate</code> \u8fc7\u6ee4\u5668\u622a\u65ad\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ data|truncate(10) }}\n</code></pre>
FILTER_wordwrap=<p style="font-weight: bold; font-size: 1.2em">wordwrap</p><p><code>wordwrap</code> \u8fc7\u6ee4\u5668\u5bf9\u7ed9\u5b9a\u7684\u5b57\u7b26\u4e32\u6362\u884c:</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{{ data|wordwrap(8, '\\n', true) }}\n</code></pre>
