MACRO_link=<p>\u751f\u6210\u94fe\u63a5\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nHere is a link: {link Presenter:action $id}\nHere is clickable &lt;a href="{link Presenter:action $id}"&gt;link&lt;/a&gt;.\nor just use &lt;a n:href="Presenter:action $id"&gt;n:tag&lt;/a&gt;.</code></pre>
MACRO_plink=<p>\u751f\u6210\u6307\u5411 presenter \u7684\u94fe\u63a5\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\nHere is a link: {plink Presenter:action $id}\nHere is clickable &lt;a href="{link Presenter:action $id}"&gt;link&lt;/a&gt;.</code></pre>
MACRO_continueIf=<p>\u6761\u4ef6\u6027\u8df3\u5230\u4e0b\u4e00\u6b21\u8fed\u4ee3\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{foreach $rows as $row}\n\    {continueIf $row->parent == NULL}\n\    ...\n{/foreach}\n</code></pre>
MACRO_breakIf=<p>\u6761\u4ef6\u6027\u4e2d\u65ad\u5faa\u73af\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{foreach $rows as $row}\n\    {breakIf $row->parent == NULL}\n\    ...\n{/foreach}\n</code></pre>
MACRO_if=<p>\u4e0e PHP \u5bf9\u5e94\u90e8\u5206\u7684\u884c\u4e3a\u5b8c\u5168\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{if $stock}\n\    In stock\n{elseif $onWay}\n\    On the way\n{else}\n\    Not available\n{/if}\n</code></pre>
MACRO_else=<p>\u4e0e PHP \u5bf9\u5e94\u90e8\u5206\u7684\u884c\u4e3a\u5b8c\u5168\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{if $stock}\n\    In stock\n{elseif $onWay}\n\    On the way\n{else}\n\    Not available\n{/if}\n</code></pre>
MACRO_elseif=<p>\u4e0e PHP \u5bf9\u5e94\u90e8\u5206\u7684\u884c\u4e3a\u5b8c\u5168\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{if $stock}\n\    In stock\n{elseif $onWay}\n\    On the way\n{else}\n\    Not available\n{/if}\n</code></pre>
MACRO_ifset=<p>\u5b83\u68c0\u67e5\u53d8\u91cf\u662f\u5426\u5b58\u5728, \u5bf9\u5e94\u4e8e PHP \u4ee3\u7801 <code>if (isset($var))</code>\u3002</p><p>\u5b8f\u4e5f\u53ef\u4ee5\u68c0\u67e5\u5757\u662f\u5426\u5b58\u5728\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{ifset $foo}\n\    ...\n{/ifset}\n</code></pre><p>\u53ef\u4ee5\u4f7f\u7528\u4ee5\u4e0b\u65b9\u5f0f\u6d4b\u8bd5\u5757\u662f\u5426\u5b58\u5728:</p><pre><code>\n{ifset #block}</code></pre>
MACRO_elseifset=<p>\u5b83\u68c0\u67e5\u53d8\u91cf\u662f\u5426\u5b58\u5728, \u5bf9\u5e94\u4e8e PHP \u4ee3\u7801 <code>elseif (isset($var))</code>\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{if true}\n\    ...\n{elseifset $foo}\n\    ...\n{/ifset}\n</code></pre>
MACRO_ifCurrent=<p>\u5b8f\u6709\u52a9\u4e8e\u786e\u5b9a\u76ee\u6807\u662f\u5426\u4e0e\u5f53\u524d\u9875\u9762\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n&lt;ul class="menu"&gt;\n    &lt;li {ifCurrent Default:default}class="current"{/ifCurrent}&gt;&lt;a href="{link Default:default}"&gt;...&lt;/a&gt;&lt;/li&gt;\n    &lt;li {ifCurrent Default:*}class="current"{/ifCurrent}&gt;&lt;a href="{link Default:default}"&gt;...&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n</code></pre>
MACRO_for=<p>\u5176\u884c\u4e3a\u4e0e PHP \u5bf9\u5e94\u90e8\u5206\u5b8c\u5168\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{for $i = 0; $i < 10; $i++}\n\    <span>Item #{$i}</span>\n{/for}</code></pre>
MACRO_foreach=<p>\u5176\u884c\u4e3a\u4e0e PHP \u5bf9\u5e94\u90e8\u5206\u5b8c\u5168\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{foreach $result as $row}\n\    <span>{$row->title}</span>\n{/foreach}</code></pre>
MACRO_while=<p>\u5176\u884c\u4e3a\u4e0e PHP \u5bf9\u5e94\u90e8\u5206\u5b8c\u5168\u76f8\u540c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{while $row = $result->fetch()}\n\    <span>{$row->title}</span>\n{/while}</code></pre>
MACRO_include=<p>\u5b83\u5c06\u6587\u4ef6\u6216\u5757\u5305\u542b\u5230\u5f53\u524d\u6a21\u677f\u4e2d\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><p>\u6587\u4ef6:</p><pre><code>\n{include 'basket.latte'}\n{include 'menu.latte', level => 3, data => $menu}\n</code></pre><p>\u5757:</p><pre><code>\n{include #sidebar}\n{include #sidebar, id => 123, name => $value}\n{include #$block$name}\n</code></pre>
MACRO_extends=<p>\u5b83\u662f <code>{layout}</code> \u7684\u522b\u540d\u3002\u6307\u5b9a\u5e03\u5c40\u6587\u4ef6\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{extends '@layout.latte'}</code></pre>
MACRO_layout=<p>\u6307\u5b9a\u5e03\u5c40\u6587\u4ef6\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{layout '@layout.latte'}</code></pre>
MACRO_control=<p>\u6253\u5370\u4e00\u4e2a\u7ec4\u4ef6\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{control cartControl}\n{control cartControl:small}\n{control cartControl:small, $maxItems}\n</code></pre>
MACRO_cache=<p>\u7f13\u5b58\u6a21\u677f\u7684\u67d0\u4e2a\u90e8\u5206\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{cache $id, expire => '+20 minutes', tags => [tag1, tag2]}\n\    ...\n{/cache}\n\n{cache $id, if => !$form->isSubmitted()}\n\    {$form}\n{/cache}\n</code></pre>
MACRO_snippet=<p>\u6807\u8bb0\u53ef\u901a\u8fc7 AJAX \u53d1\u9001\u7684\u6a21\u677f\u7247\u6bb5\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{snippet header}\n\    &lt;h1&gt;Hello .... &lt;/h1&gt;\n{/snippet}\n</code></pre>
MACRO_block=<p>\u5757\u5b9a\u4e49\u5e76\u7acb\u5373\u8f93\u51fa\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{block #sidebar}\n\    &lt;h3&gt;Menu&lt;/h3&gt;\n\    ...\n{/block}\n</code></pre>
MACRO_define=<p>\u4f9b\u4ee5\u540e\u4f7f\u7528\u7684\u5757\u5b9a\u4e49\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{define #sidebar}\n\    &lt;h3&gt;Menu&lt;/h3&gt;\n\    ...\n{/define}\n</code></pre>
MACRO_includeblock=<p>\u4ece\u5916\u90e8\u6a21\u677f\u52a0\u8f7d\u5757\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{includeblock 'file.latte'}\n</code></pre>
MACRO_contentType=<p>\u5207\u6362\u8f6c\u4e49\u6a21\u5f0f\u5e76\u53d1\u9001 HTTP \u5934\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{contentType application/xml}\n&lt;?xml version="1.0"?&gt;\n&lt;rss version="2.0"&gt;\n\    ...\n&lt;/rss&gt;\n</code></pre>
MACRO_status=<p>\u53d1\u9001 HTTP \u72b6\u6001\u7801\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{status 500}\n</code></pre>
MACRO_capture=<p>\u5c06\u8f93\u51fa\u6355\u83b7\u5230\u53d8\u91cf\u4e2d\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{capture $var}\n\    Hello World\n{/capture}\n\nCaptured: {$var}\n</code></pre>
MACRO_default=<p>\u53d8\u91cf\u672a\u58f0\u660e\u65f6\u7684\u9ed8\u8ba4\u503c\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{default $lang = 'cs'}\n</code></pre>
MACRO_var=<p>\u76f4\u63a5\u5728\u6a21\u677f\u4e2d\u58f0\u660e\u53d8\u91cf\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{var $name = 'John Smith'}\n{var $age = 27}\nor\n{var $name = 'John Smith', $age = 27}\n</code></pre>
MACRO_dump=<p>\u5c06\u53d8\u91cf\u8f6c\u50a8\u5230\u8c03\u8bd5\u680f (Debugger Bar)\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{dump $name} {* inspects the $name variable *}\n\n{dump} {* inspects all the defined variables *}\n</code></pre>
MACRO_syntax=<p>\u5728\u8fd0\u884c\u65f6\u5207\u6362\u8bed\u6cd5\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{syntax asp}\n\    &lt;%$foo%&gt;\n&lt;%/syntax%&gt;\n</code></pre>
MACRO_use=<p>\u52a0\u8f7d\u65b0\u7684\u7528\u6237\u81ea\u5b9a\u4e49\u5b8f</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{use Class}\n</code></pre>
MACRO_form=<p>\u6253\u5370\u4e00\u4e2a\u8868\u5355\u5143\u7d20\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{form myForm}\n&lt;table&gt;\n&lt;tr n:foreach="$form-&gt;controls as $name => $field"&gt;\n\    &lt;th&gt;{label $name /}&lt;th&gt;\n\    &lt;td&gt;{input $name}&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/table&gt;\n{/form}\n</code></pre>
MACRO_label=<p>\u6253\u5370\u4e00\u4e2a\u8868\u5355\u8f93\u5165\u6807\u7b7e\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{form myForm}\n&lt;table&gt;\n&lt;tr n:foreach="$form-&gt;controls as $name => $field"&gt;\n\    &lt;th&gt;{label $name /}&lt;th&gt;\n\    &lt;td&gt;{input $name}&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/table&gt;\n{/form}\n</code></pre>
MACRO_input=<p>\u6253\u5370\u4e00\u4e2a\u8868\u5355\u8f93\u5165\u5143\u7d20\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{form myForm}\n&lt;table&gt;\n&lt;tr n:foreach="$form-&gt;controls as $name => $field"&gt;\n\    &lt;th&gt;{label $name /}&lt;th&gt;\n\    &lt;td&gt;{input $name}&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/table&gt;\n{/form}\n</code></pre>
MACRO_debugbreak=<p>\u5728\u4ee3\u7801\u4e2d\u8bbe\u7f6e\u65ad\u70b9\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{debugbreak} {* breaks the program *}\n\n{debugbreak $counter == 1}  {* breaks the program if the condition is met *}\n</code></pre>
MACRO_l=<p>\u6253\u5370 <code>{</code> \u5b57\u7b26\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{l}some text{r}\n</code></pre>
MACRO_r=<p>\u6253\u5370 <code>}</code> \u5b57\u7b26\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{l}some text{r}\n</code></pre>
MACRO_first=<p>\u5982\u679c\u662f\u7b2c\u4e00\u6b21\u8fed\u4ee3\u5219\u6253\u5370\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{foreach $rows as $row}\n\    {first}&lt;table&gt;{/first}\n\n\    &lt;tr&gt;\n\        &lt;td&gt;{$row->name}&lt;/td&gt;\n\    &lt;/tr&gt;\n\n\    {last}&lt;/table&gt;{/last}\n{/foreach}\n</code></pre>
MACRO_last=<p>\u5982\u679c\u662f\u6700\u540e\u4e00\u6b21\u8fed\u4ee3\u5219\u6253\u5370\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{foreach $rows as $row}\n\    {first}&lt;table&gt;{/first}\n\n\    &lt;tr&gt;\n\        &lt;td&gt;{$row->name}&lt;/td&gt;\n\    &lt;/tr&gt;\n\n\    {last}&lt;/table&gt;{/last}\n{/foreach}\n</code></pre>
MACRO_sep=<p>\u5206\u9694\u7b26\u3002</p><p style="font-weight: bold; font-size: 1.1em">\u793a\u4f8b</p><pre><code>\n{foreach $items as $item} {$item} {sep}, {/sep} {/foreach}</code></pre>
