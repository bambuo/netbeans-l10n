OpenIDE-Module-Long-Description=Installing this plugin automatically activates Dark Metal look and feel theme in your IDE.     You can also choose Dark Nimbus look and feel in Tools - Options - Miscellaneous - Windows.     Both dark themes are designed to match Norway Today editor color profile.\n\n    Use menu Tools - Options to switch back to the default look and feel or simply deactivate this plugin.
OpenIDE-Module-Name=\u6df1\u8272\u89c2\u611f\u4e3b\u9898
LBL_DARK_METAL=\u6df1\u8272 Metal
LBL_DARK_NIMBUS=\u6df1\u8272 Nimbus
OpenIDE-Module-Short-Description=Provides dark color themes based on Metal and Nimbus look and feel.

# Added from build output (generated @Messages keys)
OpenIDE-Module-Display-Category=\u57fa\u7840 IDE
